/* Sync snapshots can arrive several at a time; writing the whole dataset
   (photos included) to localStorage on every one blocks the main thread
   and makes taps feel dead, so background paths persist throttled. */
function persistLocalSoon(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistLocal, 400);
}
/* Order-independent fingerprint of a dataset. Used to recognise when a
   sync snapshot carries nothing new — or is just the echo of this
   device's own save — so the UI is not rebuilt for no reason. */
function stableSig(o){
  if(o===null || typeof o!=="object") return JSON.stringify(o)||"";
  if(Array.isArray(o)) return "["+o.map(stableSig).join(",")+"]";
  return "{"+Object.keys(o).sort().map(function(k){ return JSON.stringify(k)+":"+stableSig(o[k]); }).join(",")+"}";
}
/* Renders triggered by background sync. If the user is mid-tap, the
   render is held until the tap finishes: rebuilding the DOM between
   touchstart and click destroys the tapped element and swallows the
   tap — the "tap several times to change tab" bug. User-initiated
   renders never come through here and always run immediately. */
function renderFromSync(){
  /* A live Jitsi meeting must survive sync snapshots: rebuilding the
     DOM destroys the meeting's iframe (the meeting drops). Hold the
     rebuild as pending while a meeting view is open — the data itself
     still lands in D, and the rebuild runs when the meeting closes. */
  if(pointerDown || typingActive || ui.meetingView){ syncRenderPending = true; return; }
  /* Throttle: at most one sync rebuild per 500 ms. A rebuild that arrives
     too soon is queued once (never stacked) and runs when the window opens.
     The fingerprint check itself lives in applyPublicSnapshot() (sig vs
     lastPubSig) and in restFetchPublic() (restLastJson) — unchanged
     snapshots never reach here, so this throttle only ever delays real
     changes, and only by <500 ms. */
  var now = Date.now();
  if(now - lastSyncRenderAt < 500){
    if(!syncRenderTimer){
      syncRenderTimer = setTimeout(function(){
        syncRenderTimer = null;
        /* The queued rebuild must respect the same holds: if the user
           started typing (or a tap) while it waited, keep it pending
           instead of rebuilding under their fingers. */
        if(pointerDown || typingActive || ui.meetingView){ syncRenderPending = true; return; }
        lastSyncRenderAt = Date.now(); render();
      }, 500 - (now - lastSyncRenderAt));
    }
    return;
  }
  lastSyncRenderAt = now;
  render();
}
function flushSyncRender(){
  if(!syncRenderPending) return;
  /* Still mid-tap or mid-typing (e.g. the tap landed in a text field):
     stay pending — the focusout flush below runs it once typing ends.
     Same for a live meeting view: flushing here would rebuild the DOM
     and drop the Jitsi iframe mid-meeting. */
  if(pointerDown || typingActive || ui.meetingView) return;
  syncRenderPending = false;
  lastSyncRenderAt = Date.now();
  if(window.requestAnimationFrame) requestAnimationFrame(function(){ render(); });
  else render();
}
/* ---- Refresh button: spinner + timeout (see the "refresh" click
   handler) ---- */
function startRefreshSpin(){
  refreshing = true;
  /* Never spin forever: even if Firebase never answers, the spinner
     stops after 5 seconds and the button becomes tappable again. */
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){ finishRefresh(false); }, 5000);
  /* Spin immediately, in the live DOM — do NOT wait for a full render(),
     which would rebuild the header and could swallow the tap. */
  try{
    var btns = document.querySelectorAll('[data-act="refresh"]');
    for(var i=0;i<btns.length;i++){
      btns[i].setAttribute("disabled","disabled");
      var svg = btns[i].querySelector("svg");
      if(svg){
        var c = svg.getAttribute("class")||"";
        if(c.indexOf("spin")<0) svg.setAttribute("class", (c+" spin").replace(/^\s+|\s+$/g,""));
      }
    }
  }catch(e){}
  renderStatus();
}
/* finishRefresh(ok) is the single exit point for a refresh: it stops the
   spinner (even on timeout/error), re-enables the button, shows the
   result, and rebuilds once — so the header comes back without "spin". */
function finishRefresh(ok){
  if(!refreshing && !refreshTimer) return;
  refreshing = false;
  clearTimeout(refreshTimer); refreshTimer = null;
  try{
    var btns = document.querySelectorAll('[data-act="refresh"]');
    for(var i=0;i<btns.length;i++){
      btns[i].removeAttribute("disabled");
      var svg = btns[i].querySelector("svg");
      if(svg){
        var c = svg.getAttribute("class")||"";
        svg.setAttribute("class", c.replace(/\bspin\b/g,"").replace(/\s+/g," ").replace(/^\s+|\s+$/g,""));
      }
    }
  }catch(e){}
  renderStatus();
  if(ok) toast("সর্বশেষ তথ্য আনা হয়েছে");
  else toast("নেটওয়ার্ক ধীর — আবার চেষ্টা করুন");
  render();
}

function publicData(src){
  var pub = JSON.parse(JSON.stringify(src));
  pub.admins = [];
  // Guardian accounts (phone + password hash) NEVER ride the public node.
  pub.guardians = [];
  // Teacher accounts (phone + password hash) NEVER ride the public node.
  // Data-deletion requests are admin-only (private node).
  pub.deletionRequests = [];
  // Complaints are admin-only: they must NEVER ride the public node
  // that every guardian phone reads. They live in the private node.
  pub.complaints = [];
  // Teacher messages are teachers-only: they must NEVER ride the public
  // node that every guardian phone reads. They live in the private node.
  pub.teacherMessages = [];
  // Guardian messages are one-guardian-only: they must NEVER ride the public
  // node that every guardian phone reads. They live in the private node.
  pub.guardianMessages = {};
  // Internet calls are one-guardian-only too (a call record names the
  // guardian's phone and the child): never on the public node.
  pub.calls = {};
  // Teacher attendance + leave applications are teachers/admin-only.
  pub.teacherAttendance = {};
  pub.teacherLeaves = [];
  // CCTV link is admin-only (the CCTV section lives in the admin area).
  pub.cctvLink = "";
  // Results & fees are personal too: the full collections NEVER ride
  // the public node. They live in the private node (admins) and, per
  // child, in childData/<studentId> (fetched on demand by guardians).
  pub.results = [];
  pub.fees = [];
  pub.students.forEach(function(s){ delete s.guardianPhone; delete s.guardianPhones; });
  pub.teachers.forEach(function(t){ delete t.phone; });
  return pub;
}
function privateData(src){
  var phones = {};
  src.students.forEach(function(s){ var phs = studentGuardianPhones(s); if(phs.length) phones["s_"+s.id] = phs; });
  src.teachers.forEach(function(t){ if(t.phone) phones["t_"+t.id] = t.phone; });
  return { admins: src.admins, guardians: src.guardians || [], phones: phones, complaints: src.complaints || [], deletionRequests: src.deletionRequests || [], results: src.results || [], fees: src.fees || [], teacherMessages: src.teacherMessages || [], guardianMessages: src.guardianMessages || {}, calls: src.calls || {}, teacherAttendance: src.teacherAttendance || {}, teacherLeaves: src.teacherLeaves || [], cctvLink: src.cctvLink || "" };
}
/* Complaints come back from Firebase either as an array or as an
   object (guardian phones write single children by id) — normalize. */
function complaintsToArray(c){
  var arr = [];
  if(Array.isArray(c)) arr = c.filter(Boolean);
  else if(c && typeof c === "object") Object.keys(c).forEach(function(k){ if(c[k]) arr.push(c[k]); });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
function mergePrivate(priv){
  if(!D.calls || typeof D.calls !== "object") D.calls = {};
  if(!priv) { privLoaded = true; return; }
  if(priv.admins) D.admins = priv.admins;
  if(priv.guardians!==undefined && priv.guardians!==null) D.guardians = guardiansToArray(priv.guardians);
  if(priv.complaints) D.complaints = complaintsToArray(priv.complaints);
  if(priv.deletionRequests!==undefined && priv.deletionRequests!==null) D.deletionRequests = complaintsToArray(priv.deletionRequests);
  if(priv.teacherMessages!==undefined && priv.teacherMessages!==null) D.teacherMessages = teacherMessagesToArray(priv.teacherMessages);
  if(priv.guardianMessages!==undefined && priv.guardianMessages!==null) D.guardianMessages = priv.guardianMessages;
  if(priv.calls!==undefined && priv.calls!==null) D.calls = priv.calls;
  if(priv.teacherAttendance!==undefined && priv.teacherAttendance!==null) D.teacherAttendance = priv.teacherAttendance;
  if(priv.teacherLeaves!==undefined && priv.teacherLeaves!==null) D.teacherLeaves = teacherLeavesToArray(priv.teacherLeaves);
  if(priv.cctvLink!==undefined && priv.cctvLink!==null) D.cctvLink = priv.cctvLink;
  // Results & fees live in the private node now. Older private nodes
  // have no such keys yet — then keep whatever this device already
  // holds (e.g. records migrated from a legacy public payload).
  if(priv.results!==undefined && priv.results!==null) D.results = priv.results;
  if(priv.fees!==undefined && priv.fees!==null) D.fees = priv.fees;
  var phones = priv.phones || {};
  D.students.forEach(function(s){ if(phones["s_"+s.id]!==undefined && phones["s_"+s.id]!==null) restoreStudentPhones(s, phones["s_"+s.id]); });
  D.teachers.forEach(function(t){ if(phones["t_"+t.id]) t.phone = phones["t_"+t.id]; });
  privLoaded = true;
  persistLocalSoon();
  // An admin device keeps the per-child guardian nodes in step, so a
  // guardian picking a child always finds that child's records.
  syncChildData();
  /* Re-sync the native flags now that the live admins are known.
     The boot-time syncNativeDeviceFlags() ran while D.admins still
     came from the local cache — if that cache was empty/stale,
     isAdmin() was false and setAdminDevice(false) cleared the
     native admin-device flag, and nothing re-synced after the live
     data loaded. mergePrivate is the single funnel for every
     private-node load (SDK listener, REST fallback, once-fetch),
     so one call here covers all of them. The call is idempotent,
     so calling it again on later snapshots is harmless. */
  syncNativeDeviceFlags();
}
function save(){
  persistLocal();
  // Remember the fingerprint of what we are about to push, so the sync
  // listener recognises its echo and does not rebuild the UI for it.
  try{ lastPubSig = stableSig(publicData(D)); }catch(e){}
  if(restMode && fbDbUrl){
    // The SDK connection is stuck — write over REST instead, so an
    // admin's updates still reach every guardian.
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      restPut("public", publicData(D)).catch(function(){});
      if(privLoaded && isAdmin()){ restPut("private", privateData(D)).catch(function(){}); syncChildData(); syncGuardians(); syncTeacherProfiles(); syncGuardianChildren(); syncGuardianChildrenByUid(); }
    }, 350);
    return;
  }
  if(fbPub){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      fbPub.set(publicData(D)).catch(function(){ syncStatus="error"; renderStatus(); });
      // Private data is only written by a device that has loaded it as an
      // admin — a guardian device never touches the private node.
      if(fbPriv && privLoaded && isAdmin()){
        fbPriv.set(privateData(D)).catch(function(){});
        syncChildData(); syncGuardians(); syncTeacherProfiles(); syncGuardianChildren(); syncGuardianChildrenByUid();
      }
    }, 350);
  }
}

/* ---------------- per-child results & fees (guardian access) -------
   Admin saves mirror each child's own results & fees into a small
   node, childData/<studentId>. A guardian device fetches ONLY the
   node of the child picked in the "রেজাল্ট ও ফি" tab — the full
   collections stay in the private node and never reach it. */
var childSigs = {};
function childPayload(stId){
  return {
    results: D.results.filter(function(r){ return r.studentId===stId; }),
    fees: D.fees.filter(function(f){ return f.studentId===stId; })
  };
}
function syncChildData(){
  if(!D || !isAdmin() || !privLoaded) return;
  D.students.forEach(function(st){
    var payload = childPayload(st.id);
    var sig = "";
    try{ sig = stableSig(payload); }catch(e){}
    if(childSigs[st.id]===sig) return;
    childSigs[st.id] = sig;
    if(restMode && fbDbUrl){ restPut("childData/"+st.id, payload).catch(function(){}); }
    else if(fbRoot){ fbRoot.child("childData").child(st.id).set(payload).catch(function(){}); }
  });
}
/* Guardian side: fetch just the picked child's node (SDK first, REST
   as the fallback when the SDK stalls — same pattern as the private
   node), then re-render the detail with only that child's records. */
function loadChildData(studentId){
  if(ui.childDataId===studentId && (ui.childData || ui.childDataLoading)) return;
  ui.childDataId = studentId; ui.childData = null; ui.childDataLoading = true;
  var apply = function(val){
    if(ui.childDataId!==studentId) return;
    ui.childDataLoading = false;
    ui.childData = { results: (val && val.results) || [], fees: (val && val.fees) || [] };
    if(ui.tab==="mychild") render();
  };
  if(restMode && fbDbUrl){ restGet("childData/"+studentId).then(apply).catch(function(){ apply(null); }); return; }
  if(fbRoot){
    fbRoot.child("childData").child(studentId).once("value").then(function(snap){ apply(snap.val()); }).catch(function(){});
    setTimeout(function(){
      if(ui.childDataId===studentId && ui.childDataLoading && fbDbUrl){
        restGet("childData/"+studentId).then(apply).catch(function(){ apply(null); });
      }
    }, 4000);
    return;
  }
  apply(null);
}

/* ---------------- Firebase live sync ---------------- */
function getFbConfig(){
  try{
    if(localStorage.getItem(FB_OFF_KEY)==="1") return null;
    var raw = localStorage.getItem(FB_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_FB_CONFIG));
}
function connectFirebase(cfg, silent){
  if(!cfg || !cfg.apiKey || !cfg.databaseURL){
    syncStatus = "local"; renderStatus(); return;
  }
  if(!window.firebase){
    // Config exists but the Firebase SDK could not load (offline / network
    // problem) — that is a connection failure, not a deliberate disconnect.
    syncStatus = "error"; renderStatus(); return;
  }
  try{
    restMode = false; stopRestPolling(); restLastJson = ""; clearTimeout(connectTimer);
    syncStatus = "connecting"; renderStatus();
    var appName = "madrasa-one-live";
    var app = null;
    for(var i=0;i<firebase.apps.length;i++){ if(firebase.apps[i].name===appName) app=firebase.apps[i]; }
    if(!app) app = firebase.initializeApp(cfg, appName);
    fbApp = app; attachFbAuthListener();
    var root = app.database().ref("madrasaApp/v1");
    fbRoot = root;
    fbPub = root.child("public");
    fbPriv = root.child("private");
    fbDbUrl = (cfg.databaseURL||"").replace(/\/+$/,"");
    fbPub.on("value", function(snap){
      // A real SDK snapshot arrived — the REST fallback stands down.
      clearTimeout(connectTimer); stopRestPolling(); restMode = false;
      applyPublicSnapshot(snap.val(), false);
    }, function(){
      if(!fbReady) startRestFallback();
      else { syncStatus = "error"; renderStatus(); }
    });
    /* The SDK connection can stall silently: it loads, but the first
       on("value") snapshot never arrives, and the status would sit on
       "connecting" forever. Guard it with a 5-second timeout — if no
       snapshot has come by then, load the same data over the REST API
       and run the app from that instead. */
    clearTimeout(connectTimer);
    connectTimer = setTimeout(function(){ if(!fbReady) startRestFallback(); }, 5000);
    // A returning admin session on this device re-attaches the private node.
    if(sessionPhone) startPrivateListening();
    /* A returning logged-in admin/guardian must get Auth-linked without
       a fresh login: if Firebase already restored their Auth session,
       record the UID now (the Auth-state listener does the same when
       it fires; this covers the case where it already fired). */
    setTimeout(function(){ try{ ensureFbAuthUidRecorded(); }catch(e){} }, 1500);
    if(!silent) toast("Firebase-এর সাথে যুক্ত হওয়ার চেষ্টা চলছে…");
  }catch(e){
    syncStatus = "error"; renderStatus();
  }
}

/* Applies a public-node payload — from the SDK listener or from the REST
   fallback — to this device's view. Collections Firebase dropped because
   they were empty are refilled from the defaults, and this device's
   private data (phones/admins) is kept, since the public node never
   carries it. */
function applyPublicSnapshot(val, fromRest){
  fbReady = true; syncStatus = "live";
  if(val && val.settings){
    // Nothing new in this snapshot — leave the UI exactly as it is.
    // Rebuilding on every sync event (including the echo of this
    // device's own saves) is what made the app feel hung.
    var sig = "";
    try{ sig = stableSig(val); }catch(e){}
    if(sig && sig===lastPubSig){ renderStatus(); return; }
    if(sig) lastPubSig = sig;
    var base = defaultData();
    Object.keys(base).forEach(function(k){ if(val[k]===undefined || val[k]===null) val[k]=base[k]; });
    Object.keys(base.settings).forEach(function(k){ if(val.settings[k]===undefined) val.settings[k]=base.settings[k]; });
    if(!String(val.settings.shareLink||"").trim()) val.settings.shareLink = DEFAULT_SHARE_LINK;
    // Keep this device's private data (phones/admins) across public
    // refreshes — the public node never carries them.
    var keepAdmins = D.admins, keepGuardians = D.guardians || [], keepPhones = privateData(D).phones, keepComplaints = D.complaints || [], keepDeletionRequests = D.deletionRequests || [], keepTeacherMessages = D.teacherMessages || [], keepTeacherAttendance = D.teacherAttendance || {}, keepTeacherLeaves = D.teacherLeaves || [], keepCctvLink = D.cctvLink || "", keepGuardianMessages = D.guardianMessages || {};
    // Results & fees no longer travel on the public node. Keep this
    // device's own copies when it has loaded the private node (admin);
    // a returning admin session adopts a legacy public payload's
    // records once, so they migrate into the private node on the next
    // save; a plain guardian device drops them entirely.
    var keepResults = [], keepFees = [];
    if(privLoaded){ keepResults = D.results || []; keepFees = D.fees || []; }
    else if(sessionPhone){ keepResults = val.results || []; keepFees = val.fees || []; }
    D = val;
    // Meetings ride the public node (participants need the room id);
    // normalise array-or-object the way the other collections do.
    D.meetings = meetingsToArray(D.meetings);
    D.results = keepResults;
    D.fees = keepFees;
    D.admins = keepAdmins;
    D.guardians = keepGuardians;
    D.deletionRequests = keepDeletionRequests;
    // Complaints are private-node data — a public refresh must never
    // wipe this device's view of them (guardian: own submissions;
    // admin: the full private list).
    D.complaints = keepComplaints;
    // Teacher messages are private-node data too — a public refresh must
    // never wipe this device's view of them.
    D.teacherMessages = keepTeacherMessages;
    // Guardian messages are private-node data too — a public refresh must
    // never wipe this device's view of them (and a later save() must
    // never write the wiped copy back over the real messages).
    D.guardianMessages = keepGuardianMessages;
    D.teacherAttendance = keepTeacherAttendance;
    D.teacherLeaves = keepTeacherLeaves;
    D.cctvLink = keepCctvLink;
    // Defense in depth: the public node must never carry phone numbers.
    // Strip any that ever appear in a public payload, then restore only
    // this device's own privately loaded ones (admin devices only).
    D.students.forEach(function(s){ delete s.guardianPhone; delete s.guardianPhones; if(keepPhones["s_"+s.id]!==undefined && keepPhones["s_"+s.id]!==null) restoreStudentPhones(s, keepPhones["s_"+s.id]); });
    D.teachers.forEach(function(t){ delete t.phone; if(keepPhones["t_"+t.id]) t.phone = keepPhones["t_"+t.id]; });
    maybeNotifyNewUrgent(D.notices);
    registerFcmToken();
    persistLocalSoon(); renderFromSync();
  } else {
    // Empty database: seed the public node with local public data.
    if(fromRest) restPut("public", publicData(D)).catch(function(){});
    else if(fbPub) fbPub.set(publicData(D)).catch(function(){});
    renderFromSync();
  }
  renderStatus();
}

/* ---------------- REST fallback ----------------
   The same database over plain HTTPS: GET/PUT on
   <databaseURL>/madrasaApp/v1/<node>.json. Engages when the SDK's live
   snapshot never arrives, and stands down if it ever does. */
function restGet(path){
  return fetch(fbDbUrl + "/madrasaApp/v1/" + path + ".json" + restAuthSuffix(), { cache:"no-store" }).then(function(r){
    if(!r.ok) throw new Error("REST " + r.status);
    return r.json();
  });
}
function restPut(path, data){
  return fetch(fbDbUrl + "/madrasaApp/v1/" + path + ".json" + restAuthSuffix(), {
    method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(data)
  });
}
function startRestFallback(){
  if(restMode || fbReady || !fbDbUrl) return;
  restMode = true;
  restFetchPublic(true);
  // Keep the guardian view fresh while the SDK stays stuck.
  stopRestPolling();
  restPollTimer = setInterval(function(){ restFetchPublic(false); }, 30000);
  if(sessionPhone) loadPrivateViaRest();
}
function stopRestPolling(){
  if(restPollTimer){ clearInterval(restPollTimer); restPollTimer = null; }
}
function restFetchPublic(first){
  return restGet("public").then(function(val){
    var js = JSON.stringify(val||null);
    if(!first && js===restLastJson){
      if(syncStatus!=="live"){ syncStatus = "live"; renderStatus(); }
      return;
    }
    restLastJson = js;
    applyPublicSnapshot(val, true);
  }).catch(function(){
    if(first && !fbReady){ syncStatus = "error"; renderStatus(); }
  });
}
function loadPrivateViaRest(){
  if(privLoaded || !fbDbUrl) return;
  restGet("private").then(function(val){
    mergePrivate(val); renderFromSync();
  }).catch(function(){
    // Never leave the admin login waiting on a stuck connection.
    privLoaded = true; renderFromSync();
  });
}

/* Fetches the private node once (admin login needs the admin accounts).
   Guardian browsing never calls this — it runs only when someone opens
   the admin login, or when an admin session already exists here. */
function ensurePrivateLoaded(){
  if(privLoaded) return;
  if(restMode){ loadPrivateViaRest(); return; }
  if(!fbPriv) return;
  fbPriv.once("value").then(function(snap){
    mergePrivate(snap.val());
    renderFromSync();
  }).catch(function(){});
  // If the SDK stays stuck, pull the private node over REST instead, so
  // the admin login never waits on a connection that never completes.
  setTimeout(function(){ if(!privLoaded) loadPrivateViaRest(); }, 4000); armAdminLoadTimeout();
}
/* Hard timeout for the admin login: if the private node has still not
   loaded after 5 seconds (SDK stuck, REST fetch hung), stop waiting
   and show the login form with whatever is known locally. A later
   snapshot still merges in and re-renders. */
var adminLoadTimer = null;
function armAdminLoadTimeout(){
  if(privLoaded || adminLoadTimer) return;
  adminLoadTimer = setTimeout(function(){
    adminLoadTimer = null;
    if(!privLoaded){ privLoaded = true; renderFromSync(); }
  }, 5000);
}
function startPrivateListening(){
  if(restMode){ loadPrivateViaRest(); return; }
  if(!fbPriv || privListening) return;
  privListening = true;
  fbPriv.on("value", function(snap){
    mergePrivate(snap.val());
    if(ui.tab==="admin" || ui.tab==="complaints" || ui.tab==="teachermsg") renderFromSync();
  });
}

/* ---------------- গার্জিয়ান লগইন + শুধু নিজের সন্তান ----------------
   A guardian must sign up / log in with their own phone number and a
   password they choose. Passwords are stored only as SHA-256 hashes
   (hashPw, above) — never plain text — and only in the private node.
   Binding: when an admin adds a student they enter that student's
   guardian phone. The admin syncs a per-phone index
   (guardianChildren/<phone> = [studentIds]) and the guardian accounts
   (guardians/<phone> = {phone, pwHash}). A guardian device NEVER fetches
   the whole guardians list or the private node — login/signup fetch ONLY
   the single guardians/<own-phone> child, and the child list ONLY the
   single guardianChildren/<own-phone> child, exactly like childData.
   So a guardian can only ever see the children linked to their own
   phone. Public notices / routine / homework / exam routine need no
   login. Results, fees and individual attendance need guardian login
   AND only for the guardian's own child. This is in-app login gating —
   NOT server-side Firebase security rules (see Privacy Policy). */
function normPhone(p){
  var s = String(p||"");
  var bn = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
  s = s.split("").map(function(c){ return bn[c]!==undefined?bn[c]:c; }).join("");
  s = s.replace(/[^0-9]/g,"");
  if(s.length===13 && s.indexOf("880")===0) s = "0"+s.slice(3);
  else if(s.length===12 && s.indexOf("88")===0) s = "0"+s.slice(2);
  else if(s.length===10 && s.charAt(0)==="1") s = "0"+s;
  return s;
}
/* ---------------- multi-number guardian linking ----------------
   THE OLD SYSTEM IS GONE: one student had ONE guardian phone. Now a
   student has up to GUARDIAN_PHONE_MAX linked numbers (guardianPhones,
   digit strings). ANY linked number + that account's own password
   logs in and sees the child; an unlinked number sees nothing.
   - guardianPhone stays as the FIRST (main) number: it is the
     migration source for the already-linked students, and the
     default number for messages/calls when the admin picks none.
   - studentGuardianPhones(st) is the ONE reader: guardianPhones
     array when present, else [guardianPhone], else []. Every other
     place in the app must use it — never s.guardianPhone directly
     for a link decision.
   - publicData() strips BOTH fields; the private node stores the
     numbers as an array in phones["s_"+id] (older string values
     still restore via restoreStudentPhones).
   - A guardian who signed up with a number the admin never added
     can still find their own child (guardianSelfLinkFlow, home card
     "🔍 আমার সন্তান খুঁজুন"): guardian name + child name + class +
     roll must match exactly one student, and the entered guardian
     name must match the recorded father or mother name when one is
     recorded. The link is written exactly the way the admin path
     writes it (student phones + guardianChildren). */
var GUARDIAN_PHONE_MAX = 4;
function studentGuardianPhones(st){
  var out = [];
  if(!st) return out;
  if(Array.isArray(st.guardianPhones)){
    st.guardianPhones.forEach(function(p){ var n = normPhone(p||""); if(n && out.indexOf(n)<0) out.push(n); });
  }
  var main = normPhone(st.guardianPhone||"");
  if(main && out.indexOf(main)<0) out.unshift(main);
  return out.slice(0, GUARDIAN_PHONE_MAX);
}
function studentHasGuardianPhone(st, ph){
  return studentGuardianPhones(st).indexOf(normPhone(ph||""))>=0;
}
/* Restore a student's numbers from the private phones map: new nodes
   store an ARRAY, old nodes a single STRING — both must keep working. */
function restoreStudentPhones(s, val){
  if(Array.isArray(val)){
    var phs = [];
    val.forEach(function(p){ var n = normPhone(p||""); if(n && phs.indexOf(n)<0) phs.push(n); });
    if(phs.length){ s.guardianPhones = phs; s.guardianPhone = phs[0]; }
  } else if(val){
    var n2 = normPhone(val||"");
    if(n2){ s.guardianPhone = n2; s.guardianPhones = [n2]; }
  }
}
function bnToEnDigits(s){
  var bn = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9"};
  return String(s||"").split("").map(function(c){ return bn[c]!==undefined?bn[c]:c; }).join("");
}
/* Student search, shared by the public শিক্ষার্থী tab and the admin list.
   Name matches as a plain substring; roll matches after Bengali-digit
   normalisation, so "১২" and "12" both find roll 12. */
function studentMatchesSearch(x, q){
  var qn = bnToEnDigits(q);
  if(x.name && x.name.indexOf(q)>=0) return true;
  if(String(x.roll).indexOf(qn)>=0) return true;
  return false;
}
/* Admin-only extension: also matches the guardian's phone number, after
   normPhone(), so a full number, a partial digit run, dashes/spaces,
   +880/880 prefixes and Bengali digits all work. Never used on the public
   tab — matching by phone there would let one guardian confirm which
   student another guardian's number is linked to. */
function studentMatchesAdminSearch(x, q){
  if(studentMatchesSearch(x, q)) return true;
  var digits = normPhone(q);
  if(digits && studentGuardianPhones(x).some(function(p){ return p.indexOf(digits)>=0; })) return true;
  return false;
}
function isGuardian(){ return !!guardianPhone; }
function isTeacher(){ return !!teacherPhone; }
/* A teacher's subjects PER CLASS: className -> [subjects], e.g.
   {ওয়ান: ["বাংলা", "ইংরেজি"], টু: ["অঙ্ক"]} — so the profile
   records WHICH subject the teacher teaches in WHICH class.
   Stored on the record as classSubjects; the flat lists
   (subjects / classes) are derived from it, so every old reader
   keeps working.
   Migration: a record with only flat lists (just-deployed version)
   reads as — the flat subjects belong to each listed class. An old
   single subject / classTaken reads as a one-element map. A teacher
   with subjects but no class at all keeps those subjects visible
   through the teacherSubjects() fallback below (nothing is lost). */
function teacherClassSubjects(t){
  if(!t) return {};
  var clean = function(list){
    var out = [];
    (list||[]).forEach(function(s){ s = String(s||"").trim(); if(s && out.indexOf(s)<0) out.push(s); });
    return out;
  };
  if(t.classSubjects && typeof t.classSubjects === "object" && !Array.isArray(t.classSubjects)){
    var map = {};
    Object.keys(t.classSubjects).forEach(function(c){
      var k = String(c||"").trim();
      if(k) map[k] = clean(t.classSubjects[c]);
    });
    if(Object.keys(map).length) return map;
  }
  var cls = [];
  if(Array.isArray(t.classes) && t.classes.length) cls = clean(t.classes);
  else if(t.classTaken) cls = [String(t.classTaken).trim()];
  var subs = [];
  if(Array.isArray(t.subjects) && t.subjects.length) subs = clean(t.subjects);
  else if(t.subject) subs = [String(t.subject).trim()];
  var m2 = {};
  cls.forEach(function(c){ m2[c] = subs.slice(); });
  return m2;
}
function teacherSubjects(t){
  if(!t) return [];
  var map = teacherClassSubjects(t), out = [];
  Object.keys(map).forEach(function(c){ map[c].forEach(function(s){ if(out.indexOf(s)<0) out.push(s); }); });
  if(out.length) return out;
  /* Subjects with no class at all — keep them visible, not lost. */
  if(Array.isArray(t.subjects) && t.subjects.length) return t.subjects.map(function(s){ return String(s||"").trim(); }).filter(Boolean);
  return t.subject ? [String(t.subject).trim()] : [];
}
function teacherClassesOf(t){
  if(!t) return [];
  var keys = Object.keys(teacherClassSubjects(t));
  if(keys.length) return keys;
  if(Array.isArray(t.classes) && t.classes.length) return t.classes.map(function(c){ return String(c||"").trim(); }).filter(Boolean);
  return t.classTaken ? [String(t.classTaken).trim()] : [];
}
/* The grouped profile line: "ওয়ান: বাংলা, ইংরেজি • টু: অঙ্ক".
   A class with no subjects yet shows just its name. */
function teacherClassSubjectLine(t){
  var map = teacherClassSubjects(t), keys = Object.keys(map);
  if(keys.length){
    return keys.map(function(c){
      var subs = map[c]||[];
      return esc(c) + (subs.length ? ": " + esc(subs.join(", ")) : "");
    }).join(" • ");
  }
  var subs = teacherSubjects(t);
  if(subs.length) return 'বিষয়: ' + esc(subs.join(", ")) + ' • <b style="color:#b91c1c">দেওয়া হয়নি</b>';
  return '<b style="color:#b91c1c">দেওয়া হয়নি</b>';
}
/* The logged-in teacher's map — session first (kept by
   setTeacherSession), the local teacher profile as fallback. */
function teacherMapForSession(){
  if(teacherSession && teacherSession.classSubjects && typeof teacherSession.classSubjects === "object") return teacherSession.classSubjects;
  return teacherClassSubjects(findTeacherByPhoneLocal(teacherPhone));
}
/* Subjects the logged-in teacher teaches in ONE class — the
   result form offers these FIRST for that class (never a block). */
function teacherSubjectsForClass(cls){
  var m = teacherMapForSession();
  return (m && Array.isArray(m[cls])) ? m[cls].slice() : [];
}
/* The logged-in teacher's classes — session first (kept by
   setTeacherSession), the local teacher profile as fallback. */
function teacherClasses(){
  if(teacherSession && Array.isArray(teacherSession.classes) && teacherSession.classes.length) return teacherSession.classes.filter(Boolean);
  if(teacherSession && teacherSession.classTaken) return [teacherSession.classTaken];
  return teacherClassesOf(findTeacherByPhoneLocal(teacherPhone));
}
/* First class, for the few places that still need one value (a leave
   record's class, the old single-class displays). */
function teacherClass(){ var c=teacherClasses(); return c.length?c[0]:""; }
function setTeacherSession(t, phone){
  teacherPhone = normPhone(phone || (t && t.phone) || "");
  /* classes is kept in the session too, so the teacher's class list
     survives a reload — the profile lookup in D.teachers is only
     the fallback. The per-class subject map is kept the same way. */
  teacherSession = { phone:teacherPhone, teacherId:(t && t.id) || "", name:(t && t.name) || "শিক্ষক", classTaken:(t && t.classTaken) || "", classes: teacherClassesOf(t), classSubjects: teacherClassSubjects(t) };
  ui.teacherId = teacherSession.teacherId; ui.teacherName = teacherSession.name; ui.teacherPhone = teacherPhone;
  try{ localStorage.setItem(TEACHER_SESSION_KEY, JSON.stringify(teacherSession)); }catch(e){}
}
function clearTeacherSession(){
  teacherPhone = ""; teacherSession = null;
  ui.teacherId = null; ui.teacherName = ""; ui.teacherPhone = "";
  try{ localStorage.removeItem(TEACHER_SESSION_KEY); }catch(e){}
}
function restoreTeacherSession(){
  if(!teacherPhone || ui.teacherId) return;
  if(teacherSession && teacherSession.teacherId){
    ui.teacherId = teacherSession.teacherId; ui.teacherName = teacherSession.name || "শিক্ষক"; ui.teacherPhone = teacherPhone; return;
  }
  var t = findTeacherByPhoneLocal(teacherPhone);
  if(t){ ui.teacherId = t.id; ui.teacherName = t.name || "শিক্ষক"; ui.teacherPhone = teacherPhone; return; }
  ui.teacherName = (teacherSession && teacherSession.name) || "শিক্ষক"; ui.teacherPhone = teacherPhone;
}
/* A student is "my child" if their id is in the logged-in guardian's
   own child list (guardianChildren/<own-phone>, loaded into
   ui.myChildIds) — this is the check that works on a guardian device.
   The phone-number check is kept as a fallback for local mode and for
   an admin device, where students still carry guardianPhone. It can
   NEVER work on a guardian device: publicData() strips guardianPhone
   from every student before the public node is written, and guardians
   never load the private node — so st.guardianPhone is always
   undefined there and the phone check alone is always false. */
function isMyChild(st){ if(!st) return false; if(ui.myChildIds && ui.myChildIds.indexOf(st.id)>=0) return true; return !!guardianPhone && studentHasGuardianPhone(st, guardianPhone); }
function myChildren(){
  if(isAdmin()) return D.students.slice();
  if(ui.myChildIds!==null && ui.myChildIds!==undefined) return D.students.filter(function(s){ return ui.myChildIds.indexOf(s.id)>=0; });
  if(!fbRoot && !restMode) return D.students.filter(isMyChild);
  return [];
}
/* ---------------- targeted notices ----------------
   A notice targets one of: everyone ("সবাই"), one class
   ("নির্দিষ্ট ক্লাস"), or one student ("নির্দিষ্ট ছাত্র").
   Stored on the notice as targetType / targetClass /
   targetStudentId (+ a name+roll snapshot for the label).
   Older notices only have `audience` ("সবার জন্য" or a class
   name) — those are read as all / class, so nothing already
   published changes meaning. Admins always see every notice;
   a guardian sees a notice only for everyone, for a class one
   of their own children is in, or for one of their own children;
   a logged-out visitor sees only "সবাই" notices. The notice
   list itself still rides the public node (titles/bodies are
   madrasa announcements) and the filter runs on each device —
   the same in-app gating the app already uses for results/fees,
   NOT server-side Firebase security rules. */
function noticeTarget(n){
  n = n || {};
  var t = String(n.targetType||"");
  if(t==="class" || t==="student"){
    var st = t==="student" ? (((D && D.students) || []).filter(function(s){ return s.id===n.targetStudentId; })[0] || null) : null;
    return { type:t, className:String(n.targetClass||""), studentId:String(n.targetStudentId||""),
      studentName: st ? st.name : String(n.targetStudentName||""), studentRoll: st ? st.roll : n.targetStudentRoll };
  }
  var aud = String(n.audience||"");
  if(aud && aud!=="সবার জন্য") return { type:"class", className:aud, studentId:"", studentName:"", studentRoll:"" };
  return { type:"all", className:"", studentId:"", studentName:"", studentRoll:"" };
}
function noticeTargetLabel(n){
  var tg = noticeTarget(n);
  if(tg.type==="class") return "ক্লাস: "+tg.className;
  if(tg.type==="student") return "ছাত্র: "+tg.studentName+", রোল "+bnNum(Number(tg.studentRoll)||tg.studentRoll);
  return "সবাই";
}
function canSeeNotice(n){
  if(isAdmin()) return true;
  var tg = noticeTarget(n);
  if(tg.type==="all") return true;
  if(!guardianPhone) return false;
  var kids = myChildren();
  if(tg.type==="class") return kids.some(function(s){ return s.className===tg.className; });
  if(tg.type==="student") return kids.some(function(s){ return s.id===tg.studentId; });
  return false;
}
function visibleNotices(){ return (D.notices||[]).filter(canSeeNotice); }
/* ---------------- notice attachments ----------------
   An attachment rides ON the notice record itself
   (notice.attach = {name, type, data, sizeKB}) in the public node,
   so every guardian who can see the notice (canSeeNotice /
   visibleNotices above) can also see its attachment — a targeted
   notice's attachment is never shown to anyone else, because the
   whole notice is filtered out for them first. The urgent ticker
   is text-only (settings.tickerText) and never carries file data.
   Allowed: images (JPG/PNG, compressed via fileToDataUrl, max 800px),
   PDF and Word documents (DOC/DOCX, raw data URL, max 3 MB).
   Only data: URLs this app produced are ever used — safeAttachUrl()
   drops anything else, so a synced value can never break out of an
   href/src attribute. */
function attachIsImage(a){ return !!a && String(a.type||"").indexOf("image/")===0 && String(a.data||"").indexOf("data:image/")===0; }
function safeAttachUrl(a){
  if(!a || !a.data) return "";
  var d = String(a.data), t = String(a.type||"");
  if(d.indexOf("data:image/")===0) return esc(d);
  if(d.indexOf("data:application/pdf")===0 && t==="application/pdf") return esc(d);
  if(d.indexOf("data:application/msword")===0 && t==="application/msword") return esc(d);
  if(d.indexOf("data:application/vnd.openxmlformats-officedocument.wordprocessingml.document")===0 && t==="application/vnd.openxmlformats-officedocument.wordprocessingml.document") return esc(d);
  return "";
}
function noticeAttachRowHtml(n){
  var a = n.attach;
  if(!a || !safeAttachUrl(a)) return "";
  var label = attachIsImage(a) ? "ছবি দেখুন" : "ফাইল দেখুন / ডাউনলোড করুন";
  return '<div class="attach-row">' + (attachIsImage(a) ? '<img src="'+safeImg(a.data)+'" alt="" />' : "📎")
    + '<span class="attach-name">📎 '+esc(a.name||"ফাইল")+(a.sizeKB ? " ("+esc(String(a.sizeKB))+" KB)" : "")+"</span>"
    + '<button type="button" class="btn ghost small" data-act="notice-attach-open" data-id="'+esc(n.id)+'">'+label+"</button></div>";
}
/* Attachment sheet: tapping an attachment NEVER starts a download
   straight away (a bare blob/data download is what kicked APK users
   out of the app on the old backup button). It opens this sheet
   inside the app. Images show full-size in the sheet. PDF/Word
   files show a "ব্রাউজারে খুলুন" button — in Chrome that opens /
   downloads the file; in the installed APK the sheet warns the
   user to open it in Chrome instead of tapping blindly. */
function noticeAttachSheetHtml(){
  var n = (D.notices||[]).filter(function(x){ return x.id===ui.attachNoticeId; })[0];

    setTimeout(function(){ if(ui.guardianIdsLoading && fbDbUrl){ restGet("guardianChildren/"+guardianPhone).then(function(v){ if(Array.isArray(v)) done(v); }).catch(function(){}); } }, 4000);
    return;
  }
  done(stored);
}

/* An admin unlink only bites on the guardian's phone once the child
   list is re-fetched. Next app open always re-fetches (ui resets at
   boot/login); while the app stays open, re-fetch when the last fetch
   is older than 10 minutes, so an unlinked number stops seeing the
   child within ~10 minutes instead of lingering for the whole session.
   A device that is OFFLINE keeps its cached list (fetch failure falls
   back to localStorage) — unlink cannot reach a phone with no data. */
function refreshMyChildIdsIfStale(){
  if(!isGuardian() || ui.guardianIdsLoading) return;
  if(ui.myChildIds===null || ui.myChildIds===undefined){ fetchMyChildIds(); return; }
  if(!ui.guardianIdsFetchedAt) return;
  if(Date.now() - ui.guardianIdsFetchedAt > 10*60*1000){ ui.myChildIds = null; fetchMyChildIds(); }
}

/* ---------------- password hashing (SHA-256) ---------------- */
function sha256(str){
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }
  // Fallback (non-secure contexts): simple FNV hash — login still works.
  return Promise.resolve().then(function(){
    var h1=0x811c9dc5, h2=0x01000193;
    for(var i=0;i<str.length;i++){ h1=Math.imul(h1^str.charCodeAt(i),0x01000193)>>>0; h2=Math.imul(h2+str.charCodeAt(i),31)>>>0; }
    return "fnv"+h1.toString(16)+h2.toString(16);
  });
}
function hashPw(phone, pw){ return sha256("madrasa::"+phone+"::"+pw); }

/* ---------------- Firebase Auth (Email/Password) ----------------
   Why: server-side Realtime Database rules can only tell users apart
   through firebase.auth() — the app's own SHA-256 hash login is
   invisible to the server. So every guardian/admin ALSO gets a
   Firebase Auth identity, using their phone as the email address
   internally (phone@madrasa-app.local). Guardians/admins still type
   ONLY phone + password in the UI; no email is ever asked for, and
   the @madrasa-app.local address is never a real mailbox.
   How it links: after a successful hash login/signup, linkFbAuth()
   signs in to (or creates) that Auth user in the background, using a
   DERIVED Auth password (authPwForPhone: "mad-<phone>-<password>") —
   never the raw app password, which Firebase rejects when shorter
   than 6 characters. A restored Auth session is also recorded via
   ensureFbAuthUidRecorded() on app start. If Auth is not enabled in
   the Firebase console yet, or the network fails, or the Auth
   password went stale after an admin reset, the link simply fails
   silently and the app keeps working on the hash login (fbAuthMode
   stays "fallback"). Auth NEVER blocks login.
   What it enables: once Email/Password Auth is enabled in the
   console and firebase-rules.json is deployed, the SDK database
   calls automatically carry the Auth token and the REST calls carry
   it via restAuthSuffix(), so the server rules can enforce:
   public = read all / write admins only; private = admins only;
   childData/<studentId> = only that child's guardian (via
   guardianChildrenByUid) or an admin. */
function authEmailForPhone(ph){ return normPhone(ph) + "@madrasa-app.local"; }
function guardianAuthEmail(ph, email){
  /* Firebase Auth address for a guardian: their real email when they signed up
     with one (so a password-reset email can reach them), otherwise the
     phone-based placeholder address used before email was collected. */
  var em = String(email||"").trim().toLowerCase();
  if(em && em.indexOf("@")>0 && em.indexOf(".")>em.indexOf("@")) return em;
  return authEmailForPhone(ph);
}
/* BUG FIX (2026-11-06): the app password must NEVER be used directly as
   the Firebase Auth password. Firebase rejects Auth passwords shorter
   than 6 characters (auth/weak-password), and app passwords may be as
   short as 4 characters — so createUserWithEmailAndPassword failed
   silently and no Auth UID was ever recorded, even after logout/login.
   The derived password below is recomputed from phone + app password on
   every login, is never stored, and is always >= 17 characters
   ("mad-" + 11-digit phone + "-" + password), so it always passes
   Firebase's length rule. The app's own hash login is unchanged. */
function authPwForPhone(ph, pw){ return "mad-" + normPhone(ph) + "-" + (pw || ""); }
function fbAuth(){
  try{
    if(!window.firebase || !firebase.auth) return null;
    if(fbApp) return firebase.auth(fbApp);
    if(firebase.apps && firebase.apps.length) return firebase.auth(firebase.apps[0]);
    return firebase.auth();
  }catch(e){ return null; }
}
function refreshFbAuthToken(){
  var a = fbAuth();
  if(!a || !a.currentUser) return;
  try{ a.currentUser.getIdToken().then(function(t){ fbAuthIdToken = t; }).catch(function(){}); }catch(e){}
}
function restAuthSuffix(){ return fbAuthIdToken ? "?auth=" + encodeURIComponent(fbAuthIdToken) : ""; }
function attachFbAuthListener(){
  if(fbAuthListenerAttached) return;
  var a = fbAuth();
  if(!a || !a.onAuthStateChanged) return;
  fbAuthListenerAttached = true;
  try{
    a.onAuthStateChanged(function(u){
      if(u){
        fbAuthUid = u.uid || ""; fbAuthMode = "auth"; refreshFbAuthToken();
        /* BUG FIX (2026-11-06): a restored Auth session used to stop
           here — the UID was kept in memory but never recorded to
           uidPhones / adminUids / the admin or guardian record, so
           Firebase still showed adminUids and uidPhones as null even
           for a logged-in admin. Record it now, using whichever
           session (admin or guardian) is active on this device. */
        ensureFbAuthUidRecorded();
      }
      else { fbAuthUid = ""; if(fbAuthMode === "auth") fbAuthMode = "fallback"; fbAuthIdToken = ""; }
    });
  }catch(e){}
}
/* Record the current Auth user's UID against the active session, if
   one is signed in. Called from the Auth-state listener (restored
   session) and once shortly after Firebase connects, so a returning
   logged-in admin/guardian gets linked without needing a fresh login.
   Needs no password: the Auth user is already signed in. */
function ensureFbAuthUidRecorded(){
  try{
    var a = fbAuth();
    if(!a || !a.currentUser) return;
    fbAuthUid = a.currentUser.uid || fbAuthUid; fbAuthMode = "auth";
    if(sessionPhone) recordFbAuthUid(sessionPhone, "admin");
    else if(guardianPhone) recordFbAuthUid(guardianPhone, "guardian");
  }catch(e){}
}
function recordFbAuthUid(phone, role){
  if(!fbAuthUid) return;
  var ph = normPhone(phone);
  // uid -> phone map (top-level node, own rule: a user may write only their own uid).
  try{
    if(restMode && fbDbUrl){ restPut("uidPhones/" + fbAuthUid, ph).catch(function(){}); }
    else if(fbRoot){ fbRoot.child("uidPhones").child(fbAuthUid).set(ph).catch(function(){}); }
  }catch(e){}
  if(role === "guardian"){
    var g = guardianByPhone(ph);
    if(g && g.authUid !== fbAuthUid){ g.authUid = fbAuthUid; saveGuardianAccount(g, function(){}); }
  } else if(role === "admin"){
    var adm = D.admins.filter(function(x){ return normPhone(x.phone) === ph; })[0];
    if(adm && adm.authUid !== fbAuthUid){ adm.authUid = fbAuthUid; save(); }
    // First admin bootstrap: this write only succeeds once the UID is
    // already in adminUids (added in the Firebase console) or while
    // rules are still off. It fails silently otherwise — see rules README.
    try{
      if(restMode && fbDbUrl){ restPut("adminUids/" + fbAuthUid, true).catch(function(){}); }
      else if(fbRoot){ fbRoot.child("adminUids").child(fbAuthUid).set(true).catch(function(){}); }
    }catch(e){}
  }
}
function linkFbAuth(phone, pw, role, email){
  var a = fbAuth();
  var aemail = guardianAuthEmail(phone, email);
  /* Derived Auth password — never the raw app password (Firebase needs at
     least 6 characters; app passwords can be 4). Recomputed every login. */
  var authPw = authPwForPhone(phone, pw);
  if(!a || !a.signInWithEmailAndPassword || !a.createUserWithEmailAndPassword) return Promise.resolve(false);
  if(a.currentUser && a.currentUser.email === aemail){
    fbAuthUid = a.currentUser.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, role);
    return Promise.resolve(true);
  }
  return a.signInWithEmailAndPassword(aemail, authPw).then(function(cred){
    fbAuthUid = cred.user.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, role);
    return true;
  }).catch(function(err){
    var code = String(err && err.code || "");
    if(code === "auth/user-not-found"){
      return a.createUserWithEmailAndPassword(aemail, authPw).then(function(cred){
        fbAuthUid = cred.user.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, role);
        return true;
      }).catch(function(){ return false; });
    }
    if(code === "auth/wrong-password" || code === "auth/invalid-credential"){
      /* Legacy case: an Auth user created before the derived-password fix
         with the raw app password (only possible if it was >= 6 chars). */
      return a.signInWithEmailAndPassword(aemail, pw).then(function(cred){
        fbAuthUid = cred.user.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, role);
        try{ if(cred.user && cred.user.updatePassword) cred.user.updatePassword(authPw).catch(function(){}); }catch(e){}
        return true;
      }).catch(function(){ return false; });
    }
    return false;
  });
}
function authSignInOnly(phone, pw, email){
  /* Sign in ONLY — never creates an Auth user (unlike linkFbAuth). Used to
     verify a guardian password against Firebase Auth before falling back
     to the stored hash, so an email-reset password works even though the
     stored hash is still the old one. */
  var a = fbAuth();
  if(!a || !a.signInWithEmailAndPassword) return Promise.resolve(false);
  var aemail = guardianAuthEmail(phone, email);
  if(a.currentUser && a.currentUser.email === aemail){ fbAuthUid = a.currentUser.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, "guardian"); return Promise.resolve(true); }
  return a.signInWithEmailAndPassword(aemail, authPwForPhone(phone, pw)).then(function(cred){
    fbAuthUid = cred.user.uid; fbAuthMode = "auth"; refreshFbAuthToken(); recordFbAuthUid(phone, "guardian"); return true;
  }).catch(function(){ return false; });
}
/* Guardian in-app password change: keep Firebase Auth in step.
   THE TRAP: guardian login tries Auth FIRST (authSignInOnly) and on
   success OVERWRITES the stored hash with the entered password's
   hash. So changing ONLY the stored hash is NOT enough while Auth is
   functional — the old password would still sign in via Auth and
   re-sync the hash back. This helper updates the Auth password too:
   updatePassword on the signed-in user, signing in with the CURRENT
   password first when there is no matching session (a fresh sign-in
   also makes the session recent enough for updatePassword).
   Resolves to one of:
     "updated"    — the Auth password now matches the new password.
     "no-auth"    — no Auth user exists for this phone, or Auth is not
                    enabled / not reachable on this device, so the
                    stored hash is the ONLY credential and the
                    hash-only change is complete.
     "stale-auth" — an Auth user exists but with an OLDER password
                    (happens after an admin reset: the reset rewrites
                    only the stored hash — see guardian-reset). The
                    guardian does not know that older password, so
                    Auth cannot be fixed from here; the caller must
                    still update the hash and WARN the user that the
                    old password may still work until the admin fixes
                    Auth (Firebase console) or the guardian signs in
                    with the old password once.
     "failed"     — network/unknown Auth error; the caller must NOT
                    change the hash, or the two systems would split
                    (old password via Auth, new via hash). */
function updateAuthPasswordForGuardian(phone, currentPw, newPw, email){
  var a = fbAuth();
  var aemail = guardianAuthEmail(phone, email);
  var newAuthPw = authPwForPhone(phone, newPw);
  var oldAuthPw = authPwForPhone(phone, currentPw);
  if(!a || !a.signInWithEmailAndPassword) return Promise.resolve("no-auth");
  /* Try the update on the current session; a stale session answers
     auth/requires-recent-login, which a fresh sign-in with the
     CURRENT password fixes (the current password was just verified
     against the stored hash by the caller). */
  var tryUpdate = function(){
    var u = null;
    try{ u = a.currentUser; }catch(e){ u = null; }
    if(!u || !u.updatePassword) return Promise.resolve("no-auth");
    return u.updatePassword(newAuthPw).then(function(){ return "updated"; }).catch(function(err){
      var code = String(err && err.code || "");
      if(code !== "auth/requires-recent-login") return "failed";
      return a.signInWithEmailAndPassword(aemail, oldAuthPw).then(function(){
        var u2 = null;
        try{ u2 = a.currentUser; }catch(e){ u2 = null; }
        if(!u2 || !u2.updatePassword) return "failed";
        return u2.updatePassword(newAuthPw).then(function(){ return "updated"; }).catch(function(){ return "failed"; });
      }).catch(function(err2){
        var c2 = String(err2 && err2.code || "");
        if(c2 === "auth/user-not-found" || c2 === "auth/operation-not-allowed") return "no-auth";
        return "stale-auth";
      });
    });
  };
  var cuEmail = "";
  try{ cuEmail = (a.currentUser && a.currentUser.email) || ""; }catch(e){ cuEmail = ""; }
  if(cuEmail === aemail) return tryUpdate();
  /* No matching session on this device (or a different user, e.g. an
     admin, is signed in) — sign in with the CURRENT password first.
     This also switches the session to the guardian; the other user's
     Auth re-links silently on their next login (linkFbAuth). */
  return a.signInWithEmailAndPassword(aemail, oldAuthPw).then(function(){ return tryUpdate(); }).catch(function(err){
    var code = String(err && err.code || "");
    if(code === "auth/user-not-found" || code === "auth/operation-not-allowed") return "no-auth";
    if(code === "auth/wrong-password" || code === "auth/invalid-credential" || code === "auth/invalid-email") return "stale-auth";
    return "failed";
  });
}

/* Self-service password change for a logged-in guardian or teacher.
   Verifies the CURRENT password against the stored hash first, then
   (guardians only) keeps Firebase Auth in step, then rewrites the
   stored hash. Teachers have no Auth identity (their login is
   hash-only), so for them the hash rewrite is the whole change.
   done(res): { ok:true, auth:"updated"|"no-auth"|"stale-auth" } or
   { ok:false, error:"current"|"short"|"mismatch"|"no-account"|"auth-failed" }.
   On "auth-failed" the hash is deliberately left UNTOUCHED, so the
   old password keeps working exactly as before instead of splitting
   the two systems. The guardian stays logged in either way. */
function changeMyPasswordFlow(phone, role, currentPw, newPw, confirmPw, done){
  var ph = normPhone(phone||"");
  if(!ph){ done({ ok:false, error:"no-account" }); return; }
  if(!newPw || newPw.length < 4){ done({ ok:false, error:"short" }); return; }
  if(newPw !== confirmPw){ done({ ok:false, error:"mismatch" }); return; }
  var load = role === "teacher" ? loadTeacherAccount : loadGuardianAccount;
  load(ph, function(acc){
    if(!acc){ done({ ok:false, error:"no-account" }); return; }
    hashPw(ph, currentPw||"").then(function(h){
      if(h !== acc.pwHash){ done({ ok:false, error:"current" }); return; }
      var finish = function(authStatus){
        if(authStatus === "failed"){ done({ ok:false, error:"auth-failed" }); return; }
        hashPw(ph, newPw).then(function(h2){
          acc.pwHash = h2;
          var local = role === "teacher" ? teacherAccountByPhone(ph) : guardianByPhone(ph);
          if(local && local !== acc) local.pwHash = h2;
          var saveFn = role === "teacher" ? saveTeacherAccount : saveGuardianAccount;
          saveFn(acc, function(){ done({ ok:true, auth:authStatus }); });
        });
      };
      if(role === "teacher"){ finish("no-auth"); return; }
      updateAuthPasswordForGuardian(ph, currentPw, newPw, acc.email).then(finish).catch(function(){ finish("failed"); });
    });
  });
}
/* Guardian self-link by name + roll (home card "🔍 আমার সন্তান খুঁজুন"
   and the ⋮ menu row of the same name). A guardian who scanned the QR
   outside the madrasa and signed up with a number the admin never
   added can still find their own child: guardian name + child name +
   class + roll. Matching is exact on the normalized name/roll/class —
   nothing fuzzy, nothing revealed: a wrong guardian name is refused
   without ever showing the recorded names, and multiple matches are
   refused outright. The link is written the same way the admin path
   writes it (putStudentPhones + putGuardianChildrenForPhone), because
   a guardian device cannot use save() for the private node.
   Errors are {ok:false, error:"..."}; success is {ok:true, student}.
   The caller (submit branch) turns them into toasts. */
function guardianSelfLinkNormName(s){
  var t = String(s||"").replace(/[\u200c\u200d]/g,"").trim().replace(/\s+/g," ");
  /* "মোহাম্মদ"/"মোহাম্মাদ" and "মোঃ" are the same name in practice —
     normalize the long form to the short form before the fixer runs,
     so a guardian who types either spelling matches the same record. */
  t = t.replace(/^মোহাম্মদ\s+/,"মোঃ ").replace(/^মোহাম্মাদ\s+/,"মোঃ ");
  return idcardFixMoPrefix(t);
}
function guardianSelfLinkNormRoll(s){
  var t = bnToEnDigits(String(s==null?"":s)).trim();
  if(/^\d+$/.test(t)) return String(parseInt(t,10));
  return t;
}
function guardianSelfLinkFlow(gNameRaw, cNameRaw, clsRaw, rollRaw, done){
  var ph = normPhone(guardianPhone||"");
  if(!isGuardian() || !ph){ done({ ok:false, error:"no-account" }); return; }
  var gName = guardianSelfLinkNormName(gNameRaw);
  var cName = guardianSelfLinkNormName(cNameRaw);
  var cls = String(clsRaw||"").trim();
  var roll = guardianSelfLinkNormRoll(rollRaw);
  if(!gName || !cName || !cls || !roll){ done({ ok:false, error:"missing" }); return; }
  var matches = (D.students||[]).filter(function(s){
    return (s.className||"")===cls
      && guardianSelfLinkNormRoll(s.roll)===roll
      && guardianSelfLinkNormName(s.name)===cName;
  });
  if(!matches.length){ done({ ok:false, error:"not-found" }); return; }
  if(matches.length>1){ done({ ok:false, error:"multiple" }); return; }
  var st = matches[0];
  /* Parent-name check FIRST: when the record has a father or mother
     name, the entered guardian name must match one of them. A miss is
     refused WITHOUT revealing the recorded names. */
  var f = guardianSelfLinkNormName(st.fatherName||"");
  var m = guardianSelfLinkNormName(st.motherName||"");
  if((f || m) && gName!==f && gName!==m){ done({ ok:false, error:"name-mismatch" }); return; }
  if(studentHasGuardianPhone(st, ph)){ done({ ok:false, error:"already" }); return; }
  if(studentGuardianPhones(st).length>=GUARDIAN_PHONE_MAX){ done({ ok:false, error:"max" }); return; }
  /* Re-check against the live server list (the in-memory copy on a
     guardian device carries no numbers — the public snapshot strips
     them — so the live list is the truth), then write. */
  getStudentPhones(st.id).then(function(live){
    var next = (live||[]).slice();
    if(next.indexOf(ph)>=0){ done({ ok:false, error:"already" }); return; }
    if(next.length>=GUARDIAN_PHONE_MAX){ done({ ok:false, error:"max" }); return; }
    next.push(ph);
    next = next.slice(0, GUARDIAN_PHONE_MAX);
    var stLocal = (D.students||[]).filter(function(x){ return x.id===st.id; })[0];
    if(stLocal){ stLocal.guardianPhones = next; if(!stLocal.guardianPhone) stLocal.guardianPhone = next[0]; }
    var ids = Array.isArray(ui.myChildIds) ? ui.myChildIds.slice() : [];
    if(ids.indexOf(st.id)<0) ids.push(st.id);
    putStudentPhones(st.id, next).then(function(){
      putGuardianChildrenForPhone(ph, ids).catch(function(){}).then(function(){
        ui.myChildIds = ids;
        try{ localStorage.setItem(GUARDIAN_CHILDREN_KEY, JSON.stringify(ids)); }catch(e){}
        try{ syncNativeDeviceFlags(); }catch(e){}
        done({ ok:true, student: stLocal || st });
      });
    }).catch(function(){ done({ ok:false, error:"write" }); });
  }).catch(function(){ done({ ok:false, error:"write" }); });
}

  });

/* ---------------- public "about" section on the entry screen ----------------
   Shown BELOW the three role buttons on the logged-out entry screen, so
   Google's crawler and first-time visitors see real madrasa content
   without logging in. HARD PRIVACY RULE: this section only ever renders
   data that is already public — the madrasa name and classes, the public
   class routine, and notices targeted to everyone. It NEVER renders
   student names/rolls, guardian or teacher phones, results, fees,
   attendance, opinions or complaints. A targeted notice is filtered out
   first (noticeTarget type "all" only), and its title is also checked
   against the student list and phone-like digit runs, so a title that
   happens to name a child or carry a number can never leak through.
   D is always present when entryHtml runs — render() returns early
   while D is null, and boot loads D from the local cache before the
   first render — so the routine/notices render from D at first paint,
   and live sync updates flow in through the existing renderFromSync
   path (which re-renders the entry screen, typing guard included). */
function entryNoticeIsPublic(n){
  if(noticeTarget(n).type!=="all") return false;
  var t = String(n.title||"").trim();
  if(!t) return false;
  /* A phone-like digit run in the title (Bengali digits normalised) —
     a number must never reach the public page. */
  if(/\d{7,}/.test(bnToEnDigits(t))) return false;
  /* A title that names a student — fail closed, drop the notice.
     Checked word by word (a title can carry part of a name, e.g.
     "ইমরান হাসানকে অভিনন্দন" without the "মোঃ" prefix); a dropped
     notice is only a hidden notice, never a leak. */
  var students = D.students || [];
  for(var i=0;i<students.length;i++){
    var parts = String(students[i].name||"").trim().split(/\s+/);
    for(var j=0;j<parts.length;j++){
      var w = parts[j];
      if(w.length>=4 && t.indexOf(w)>=0) return false;
    }
  }
  return true;
}
function entryNoticesHtml(){
  var list = (D.notices||[]).filter(entryNoticeIsPublic);
  if(!list.length) return "";
  list = list.slice().sort(function(a,b){ return String(b.createdAt||"").localeCompare(String(a.createdAt||"")); }).slice(0,3);
  return '<h3 style="margin:14px 0 6px;font-size:15px">📢 নোটিশ</h3>'

/* Region cache for render(): the masthead carries the ~400KB logo, and
   rebuilding the whole page on every render re-parses it and destroys
   focused inputs. render() below only swaps the main region when the
   masthead / tab bar / sheets are byte-identical to last time; anything
   that changes them (menu, badges, logo, sheet open/close) changes the
   string, so the full rebuild still runs then. Reset on logout (the
   entry screen has no masthead). */
var lastMastheadHtml = null, lastTabbarHtml = null, lastSheetHtml = null;
function render(){
  if(!D) return;
  restoreTeacherSession();
  /* ?entry=1 share link: force this render onto the entry screen even
     when a session exists. One-shot — cleared here, so the very next
     render (panel tap, tab switch, sync) goes inside as normal. */
  if(ui.forceEntry || (!isGuardian() && !isAdmin() && !isTeacher())){
    ui.forceEntry = false;
    lastMastheadHtml = null; lastTabbarHtml = null; lastSheetHtml = null;
    document.body.classList.toggle("has-ticker", false);
    var tkGate = document.getElementById("ticker"); if(tkGate) tkGate.hidden = true;
    appEl.innerHTML = entryHtml(D.settings);
    afterRender();
    return;
  }
  markOpinionsComplaintsSeen();
  /* Internet call: a guardian's phone must ring on ANY tab while the
     app is open — start the 3s incoming-call poll whenever a
     guardian session exists (self-guarded, one timer at most). The
     native Accept action (?call= in the URL) auto-joins once. */
  scheduleCallGuardianPoll();
  maybeJoinInvitedCall();
  var s = D.settings;
  var tickerOn = s.tickerEnabled && (s.tickerText||"").trim();
  document.body.classList.toggle("has-ticker", !!tickerOn);
  var tk = document.getElementById("ticker");
  if(tickerOn){
    tk.hidden = false;
    var txt = esc(s.tickerText);
    document.getElementById("tickerTrack").innerHTML = "<span>📢 "+txt+"</span><span>📢 "+txt+"</span>";
  } else tk.hidden = true;

  if(ui.tab==="admin" && !ui.adminRevealed && !isAdmin()) ui.tab = "home";

  var mh = mastheadHtml(s);
  var tb = tabbarHtml();
  var mainInner = mainContentHtml(s);
  var sheetH = "";
  if(ui.sheet==="share") sheetH += shareSheetHtml(s);
  if(ui.sheet==="install") sheetH += installSheetHtml();
  if(ui.sheet==="apk") sheetH += apkSheetHtml();
  if(ui.sheet==="backup") sheetH += backupSheetHtml();
  if(ui.sheet==="attach") sheetH += noticeAttachSheetHtml();
  if(ui.sheet==="hw-photo") sheetH += hwPhotoSheetHtml();
  if(ui.sheet==="result-attach") sheetH += resultAttachSheetHtml();
  if(ui.sheet==="camera") sheetH += cameraSheetHtml();
  if(ui.sheet==="idcard-rotate") sheetH += idcardRotateSheetHtml();
  if(ui.sheet==="change-password") sheetH += changePasswordSheetHtml();
  if(ui.sheet==="guardian-self-link") sheetH += guardianSelfLinkSheetHtml();
  if(shouldShowNotifyPrompt()) sheetH += notifyPopupHtml();
  /* Internet call overlays (v1.0.17): an incoming call must appear
     on ANY tab while the app is open, and the admin's calling /
     in-call screen must stay up regardless of tab — so both render
     as full-screen overlays on top of whatever tab is open. */
  if(ui.callIncoming && isGuardian()) sheetH += callIncomingHtml();
  if(ui.callScreen) sheetH += callScreenHtml();
  /* Group meeting (Jitsi, v1.0.18): the meeting view is a full-screen
     overlay on any tab, like the call screens above. */
  if(ui.meetingView) sheetH += meetingViewHtml();

  /* Fast path: only the main content changed. Leave the masthead (logo),
     the tab bar and any open sheet untouched — exactly like the
     renderTabSwitch() fast path — and swap only the main region. */
  var mhEl = appEl.querySelector("header.mast");
  var navEl = appEl.querySelector("nav.tabs");
  var mainEl = document.getElementById("mainRegion");
  if(mhEl && navEl && mainEl && mh===lastMastheadHtml && tb===lastTabbarHtml && sheetH===lastSheetHtml){
    mainEl.innerHTML = '<div class="wrap">' + mainInner + "</div>";
  } else {
    appEl.innerHTML = mh + tb + '<main id="mainRegion"><div class="wrap">' + mainInner + "</div></main>" + sheetH;
    lastMastheadHtml = mh; lastTabbarHtml = tb; lastSheetHtml = sheetH;
  }
  afterRender();
}

  else if(ui.tab==="teachers") html += teachersHtml(s);
  else if(ui.tab==="teachermsg") html += teacherMessagesHtml();
  else if(ui.tab==="guardianmsg") html += guardianMessagesHtml();
  else if(ui.tab==="routine") html += routineHtml();
  else if(ui.tab==="homework") html += homeworkHtml();
  else if(ui.tab==="exam") html += examHtml();
  else if(ui.tab==="teacheratt") html += teacherAttendanceHtml();
  else if(ui.tab==="opinions") html += opinionsHtml();
  else if(ui.tab==="complaints") html += complaintsHtml();
  else if(ui.tab==="privacy") html += privacyHtml();
  else if(ui.tab==="admin") html += adminHtml();
  if(ui.tab!=="admin" && ui.confirmDelete) html += confirmDeleteHtml();

    html += shareCardHtml();

      html += '<footer class="login-entry"><button type="button" class="btn ghost" data-act="open-login">'+icon("lock","sm")+' অ্যাডমিন লগইন</button>'

    }

  return html;
}

/* Fast path for tab switches: rebuild only the tab bar's active state
   and the main region. The masthead — logo image and all — is left
   untouched, so one tap switches instantly, whatever the Firebase sync
   happens to be doing in the background. */
function renderTabSwitch(){
  if(!D){ render(); return; }
  restoreTeacherSession();
  if(!isGuardian() && !isAdmin() && !isTeacher()){ render(); return; }
  if(ui.tab==="admin" && !ui.adminRevealed && !isAdmin()) ui.tab = "home";
  markOpinionsComplaintsSeen();
  var nav = appEl.querySelector("nav.tabs");
  if(nav){
    var tmp = document.createElement("div");
    tmp.innerHTML = tabbarHtml();
    if(tmp.firstChild) nav.replaceWith(tmp.firstChild);
  }
  var main = document.getElementById("mainRegion");
  if(!main){ render(); return; }
  main.innerHTML = '<div class="wrap">' + mainContentHtml(D.settings) + "</div>";
  afterRender();
}

     left in place unused; entry-screen login and the রেজাল্ট ও ফি tab
     login (guardianLoginHtml) are untouched. */
  var visNotices = visibleNotices();
  if(!visNotices.length){
    html += '<div class="card empty">এখনো কোনো নোটিশ দেওয়া হয়নি।<br/>অ্যাডমিন নোটিশ দিলে এখানে দেখা যাবে।</div>';
  } else {
    html += visNotices.map(function(n){
      return '<article class="notice"><h3>'+esc(n.title)+'</h3><div class="meta">'+fmtDateBn(n.createdAt)
        + ' &nbsp;<span class="pill">'+esc(noticeTargetLabel(n))+"</span>"
        + (n.urgent?' &nbsp;<span class="pill urgent">জরুরি</span>':"")
        + "</div><p>"+esc(n.body)+"</p>"+noticeAttachRowHtml(n)+"</article>";
    }).join("");
    if(isGuardian() && D.notices.length > visNotices.length)
      html += '<p class="dim small" style="margin:2px 0 0">শুধু আপনার সন্তানের জন্য প্রযোজ্য নোটিশগুলোই দেখাচ্ছে — অন্য ক্লাস বা ছাত্রের নোটিশ এখানে আসে না।</p>';
  }
  /* Diagnostic footer: installed APK or plain browser — one small dim
     line at the very bottom of the home. */
  html += appPlatformLine();
  return html;
}
