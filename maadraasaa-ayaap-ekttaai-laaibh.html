function studentDetailHtml(st){
  var backBtn = '<button type="button" class="btn ghost small" data-act="'+(ui.tab==="mychild"?"mychild-back":"student-back")+'">'+icon("back","sm")+" তালিকায় ফিরুন</button>";
  /* Student-detail LOCK (2026-11-11): a guardian may NEVER see
     another student's information. Tapping any student card opens
     this locked state unless the student is one of the guardian's
     own linked children — no photo, no name, no class, no roll, no
     attendance, no results, no fees, no messages. Admins keep full
     access; teachers are unchanged (the gate applies to guardians
     only — a teacher passes isGuardian() only when also logged in
     as a guardian). When the child list is still loading, isMyChild
     is false, so the lock errs on the safe side until the fetch
     completes and re-renders. */
  if(isGuardian() && !isAdmin() && !isMyChild(st)){
    return backBtn
      + '<div class="card" style="border:3px solid var(--danger);margin-top:12px;padding:18px;text-align:center">'
      + '<div style="font-size:19px;font-weight:800;line-height:1.3">🔒 এই তথ্য শুধু ওই সন্তানের গার্জিয়ান দেখতে পারেন</div>'
      + '<p class="dim small" style="margin:8px 0 12px">আপনার সন্তানের তথ্য দেখতে নিচের বোতামে চাপ দিন — নাম, শ্রেণী ও রোল দিয়ে সন্তান যুক্ত করা যাবে।</p>'
      + '<div class="row-btns" style="justify-content:center"><button type="button" class="btn gold" data-act="open-guardian-self-link">🔍 আমার সন্তান খুঁজুন</button></div></div>';
  }
  var myAtt = [], myRes = [], myFees = [];
  Object.keys(D.attendance).forEach(function(k){
    var rec = D.attendance[k] && D.attendance[k][st.id];
    if(rec) myAtt.push({ date:k.slice(k.lastIndexOf("|")+1), status:rec });
  });
  myAtt.sort(function(a,b){ return a.date<b.date?1:-1; });
  /* Privacy: results and fees are personal. They render only for a
     logged-in admin (from the private node), or inside the guardian's
     own "রেজাল্ট ও ফি" tab for the one child that guardian picked —
     in live mode those records come from that child's own childData
     node, fetched on demand; the full collections never reach a
     guardian device. Never from the public student list, and never
     as an all-students list. */
  var canSeePrivate = isAdmin() || (ui.tab==="mychild" && isMyChild(st));
  var childLoading = false;
  myRes = []; myFees = [];
  if(isAdmin()){
    myRes = D.results.filter(function(r){ return r.studentId===st.id; });
    myFees = D.fees.filter(function(f){ return f.studentId===st.id; });
  } else if(ui.tab==="mychild"){
    if(fbRoot || restMode){
      if(ui.childData && ui.childDataId===st.id){ myRes = ui.childData.results || []; myFees = ui.childData.fees || []; }
      else childLoading = true;
    } else {
      // Local mode: everything lives on this one device already.
      myRes = D.results.filter(function(r){ return r.studentId===st.id; });
      myFees = D.fees.filter(function(f){ return f.studentId===st.id; });
    }
  }
  var present = myAtt.filter(function(a){ return a.status==="present"||a.status==="late"; }).length;
  var html = backBtn;
  html += '<div class="founder-card" style="margin-top:12px">'
    + (safeImg(st.photo)?'<img src="'+safeImg(st.photo)+'" alt="শিক্ষার্থীর ছবি" />':'<div class="avatar-fallback">'+icon("grad","lg")+"</div>")
    + '<div><span class="chip">'+esc(st.className)+'</span><h3>'+esc(st.name)+"</h3><p style='margin:2px 0 0'>রোল: "+esc(bnNum(Number(st.roll)||st.roll))+"</p></div></div>";
  html += '<div class="detail-grid">';
  if(canSeePrivate){
    html += '<div class="detail-box"><h4>'+icon("calcheck")+' হাজিরা</h4>'
      + '<p style="margin:0 0 6px"><span class="pill gold">শ্রেণী: '+esc(st.className)+'</span> <span class="dim small">— এই শ্রেণীর হাজিরা</span></p>'
      + (myAtt.length
        ? "<p>মোট দিন: "+bnNum(myAtt.length)+" • উপস্থিত: "+bnNum(present)+"</p>" + myAtt.slice(0,6).map(function(a){ return "<p>"+fmtDateBn(a.date)+" — "+attLabel(a.status)+"</p>"; }).join("")
        : '<p class="dim">এখনো হাজিরা রেকর্ড নেই।</p>') + "</div>";
  } else {
    html += '<div class="detail-box"><h4>'+icon("lock")+' হাজিরা — শুধু নিজের সন্তানের</h4>'
      + '<p class="dim">হাজিরা প্রত্যেক শিক্ষার্থীর ব্যক্তিগত তথ্য, তাই এখানে দেখানো হয় না। গার্জিয়ান লগইন করে <b>রেজাল্ট ও ফি</b> ট্যাবে গেলে শুধু আপনার সন্তানের হাজিরা, রেজাল্ট ও ফি-ই দেখা যাবে।</p></div>';
  }
  if(canSeePrivate){
    html += '<div class="detail-box"><h4>'+icon("trophy")+' পরীক্ষার রেজাল্ট</h4>'
      + (myRes.length
        ? myRes.map(function(r){ return "<p><b>"+esc(st.name)+"</b>"+classPill(st)+"<br/>শ্রেণী: "+esc(st.className)+" • রোল: "+esc(bnNum(Number(st.roll)||st.roll))+"<br/>পরীক্ষা: <b>"+esc(r.exam)+"</b><br/>প্রাপ্ত নম্বর "+bnNum(r.marks)+"/"+bnNum(r.total)+" • গ্রেড "+esc(r.grade)+resultSubjectsHtml(r)+resultAttachmentsHtml(r)+"</p>"; }).join("")
        : '<p class="dim">'+(childLoading?"লোড হচ্ছে…":"এখনো রেজাল্ট দেওয়া হয়নি।")+'</p>') + "</div>";
    html += '<div class="detail-box"><h4>'+icon("wallet")+' ফি-এর হিসাব</h4>'
      + (myFees.length
        ? myFees.map(function(f){ return "<p><b>মাস: "+esc(f.month)+"</b>"+classPill(st)+"<br/>শিক্ষার্থী: "+esc(st.name)+" • শ্রেণী: "+esc(st.className)+"<br/>"+fmtMoney(f.amount)+" • "+feeLabel(f.status)+"</p>"; }).join("")
        : '<p class="dim">'+(childLoading?"লোড হচ্ছে…":"এখনো ফি-এর হিসাব দেওয়া হয়নি।")+'</p>') + "</div>";
  } else {
    html += '<div class="detail-box"><h4>'+icon("lock")+' রেজাল্ট ও ফি — শুধু নিজের সন্তানের</h4>'
      + '<p class="dim">রেজাল্ট ও ফি প্রত্যেক শিক্ষার্থীর ব্যক্তিগত তথ্য, তাই এখানে দেখানো হয় না। গার্জিয়ান লগইন করে <b>রেজাল্ট ও ফি</b> ট্যাবে গেলে শুধু আপনার সন্তানের রেজাল্ট ও ফি-ই দেখা যাবে — অন্য কারো সন্তান খুলবে না।</p></div>';
  }
  html += "</div>";
  return html;
}

/* Guardian-only private view: pick the class, then find the child by
   name or roll and tap them — only that one child's results and fees
   are shown. No all-students results/fees list exists in this view. */
function myChildHtml(){
  /* Guardian login gate: no login, no child data at all. Admins keep
     their full view through the Admin panel; here an admin also sees
     the full list, but a guardian sees ONLY their own linked children. */
  if(ui.myChildId){
    var st0 = D.students.filter(function(x){ return x.id===ui.myChildId; })[0];
    if(st0 && (isAdmin() || isMyChild(st0))){
      if(!isAdmin() && (fbRoot || restMode) && ui.childDataId!==st0.id) loadChildData(st0.id);
      return studentDetailHtml(st0);
    }
    ui.myChildId = null;
  }
  /* Teachers publish results here (their own class only) — the admin
     still sees the full child list below, and the admin result form
     lives in the Admin panel. */
  if(isTeacher() && !isAdmin()) return teacherBarHtml() + teacherResultFormHtml();
  if(!isGuardian() && !isAdmin()) return guardianLoginHtml();
  if(isGuardian()) refreshMyChildIdsIfStale();
  var html = '<h2 class="sec-title">'+icon("trophy")+" আমার সন্তানের রেজাল্ট ও ফি</h2>";
  if(isGuardian()){
    html += '<div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>গার্জিয়ান লগইন করা আছে</b><div class="dim small">ফোন: '+esc(guardianPhone)+' — নিচে শুধু আপনার সন্তান(দের) দেখা যাচ্ছে।</div></div><button type="button" class="btn ghost small" data-act="guardian-logout">লগআউট</button></div>';
  }
  html += '<p class="dim small" style="margin:0 0 10px">রেজাল্ট, ফি ও হাজিরা ব্যক্তিগত তথ্য — একজন গার্জিয়ান শুধু নিজের সন্তানেরটাই দেখতে পারবেন, অন্য কারো নয়। নিচের তালিকায় শুধু আপনার সন্তান আছে; নাম বা রোল দিয়ে শুধু আপনার সন্তানের ভেতরেই খুঁজতে পারবেন।</p>';
  html += '<div class="filter-row"><select data-change="mychild-class" aria-label="শ্রেণী বেছে নিন">'
    + '<option'+(ui.myChildClass==="সব ক্লাস"?" selected":"")+">সব ক্লাস</option>"
    + D.classes.map(function(c){ return "<option"+(ui.myChildClass===c?" selected":"")+">"+esc(c)+"</option>"; }).join("")
    + '</select><input type="search" placeholder="আপনার সন্তানের নাম বা রোল দিয়ে খুঁজুন" data-input="mychild-search" value="'+esc(ui.myChildSearch)+'" aria-label="সন্তান খুঁজুন" /></div>';
  var list = myChildren().filter(function(x){
    if(ui.myChildClass!=="সব ক্লাস" && x.className!==ui.myChildClass) return false;
    if(ui.myChildSearch){ var q=ui.myChildSearch.trim(); if(x.name.indexOf(q)<0 && String(x.roll).indexOf(q)<0) return false; }
    return true;
  });
  list.sort(function(a,b){ return (Number(a.roll)||0)-(Number(b.roll)||0); });
  if(!list.length){
    html += '<div class="card empty">'+(isAdmin()?"কোনো শিক্ষার্থী পাওয়া যায়নি।":"এই ফোন নম্বরে এখনো কোনো সন্তান নিবন্ধিত নেই।<br/>অ্যাডমিন আপনার ফোন নম্বরে সন্তান যোগ করলেই এখানে দেখা যাবে।")+'</div>';
    return html;
  }
  html += list.map(function(x){
    return '<button type="button" class="person" data-act="mychild-open" data-id="'+x.id+'">'
      + (safeImg(x.photo)?'<img src="'+safeImg(x.photo)+'" alt="" />':'<span class="avatar-fallback">'+icon("grad")+"</span>")
      + "<span><b>"+esc(x.name)+"</b><small>রোল: "+esc(bnNum(Number(x.roll)||x.roll))+" • শ্রেণী: "+esc(x.className)+"</small></span>"
      + '<span class="chev">'+icon("chev")+"</span></button>";
  }).join("");
  return html;
}

function attendanceHtml(){
  if(!isAdmin() && !isGuardian() && !isTeacher()){
    /* Inline guardian login, right here in the হাজিরা tab: the SAME
       guardianLoginHtml() the mychild tab uses — same form
       (data-form="guardian-login"), same hashing, same session, same
       error messages. No second login implementation. After a
       successful login the handler keeps the guardian on this tab
       (see doGuardianLogin), so the child's attendance appears here
       at once instead of jumping to another tab. */
    return '<h2 class="sec-title">'+icon("calcheck")+' হাজিরা</h2>'
      + '<p class="dim small" style="margin:0 0 10px">হাজিরা প্রত্যেক বাচ্চার ব্যক্তিগত তথ্য — লগইন ছাড়া কারো হাজিরা দেখানো হয় না। নিচে আপনার ফোন নম্বর ও পাসওয়ার্ড দিয়ে লগইন করুন — লগইন করলেই এখানেই শুধু আপনার সন্তানের হাজিরা দেখতে পাবেন।</p>'
      + guardianLoginHtml();
  }
  if(isTeacher()){
    return teacherBarHtml() + adminAttendanceHtml();
  }
  if(isGuardian()) refreshMyChildIdsIfStale();
  /* Guardian default: open on their OWN child's class, not D.classes[0]
     (শিশু) — otherwise a guardian whose child is in ওয়ান/থ্রি sees
     "এই ক্লাসে কোনো শিক্ষার্থী নেই" until they find the dropdown.
     attClassPicked is set only when the user changes the dropdown, so
     the boot default and a previous account's pick never trap a
     guardian on an empty class. While the child list is still loading
     (kids empty) we fall back to D.classes[0] for this render only —
     ui.attClass is NOT stored, so the re-render after fetchMyChildIds
     still picks the child's class. */
  var cls = ui.attClass;
  if(isGuardian() && !isAdmin() && !ui.attClassPicked){
    var kids = myChildren();
    if(kids.length && kids[0].className){ cls = kids[0].className; ui.attClass = cls; }
  }
  if(!cls) cls = D.classes[0] || "";
  var html = '<h2 class="sec-title">'+icon("calcheck")+" হাজিরা</h2>";
  html += '<p class="dim small" style="margin:0 0 10px">তারিখ আর ক্লাস বেছে নিন — সেই ক্লাসে আজ কতজন উপস্থিত আছে আর কারা কারা উপস্থিত, সব দেখতে পাবেন। নিজের সন্তানের নাম খুঁজলেই বুঝতে পারবেন সে আজ প্রতিষ্ঠানে উপস্থিত আছে কিনা।</p>';
  html += '<div class="filter-row"><input type="date" data-change="att-date" value="'+ui.attDate+'" aria-label="তারিখ বেছে নিন" />'
    + '<select data-change="att-class" aria-label="ক্লাস বেছে নিন">'
    + D.classes.map(function(c){ return "<option"+(ui.attClass===c?" selected":"")+">"+esc(c)+"</option>"; }).join("") + "</select></div>";
  var key = cls + "|" + ui.attDate;
  var day = D.attendance[key] || {};
  var published = Object.keys(day).length > 0;
  var classList = D.students.filter(function(x){ return x.className===cls; });
  var list = isAdmin() ? classList : myChildren().filter(function(x){ return x.className===cls; });
  list.sort(function(a,b){ return (Number(a.roll)||0)-(Number(b.roll)||0); });
  if(!D.classes.length){ html += '<div class="card empty">কোনো ক্লাস নেই।</div>'; return html; }
  var p=0,a=0,l=0;
  classList.forEach(function(x){ if(day[x.id]==="present")p++; else if(day[x.id]==="absent")a++; else if(day[x.id]==="late")l++; });
  var totalPresent = p + l;
  html += '<section class="card" style="border-top:4px solid var(--gold)"><p style="margin:0 0 4px;font-size:18px"><b>'+esc(cls)+' শ্রেণীর হাজিরা</b></p>'
    + '<p style="margin:0 0 8px"><span class="pill gold">ক্লাস: '+esc(cls)+'</span> &nbsp;<span class="dim small">তারিখ: '+fmtDateBn(ui.attDate)+"</span></p>";
  if(!list.length){ html += '<p class="dim" style="margin:0">এই ক্লাসে কোনো শিক্ষার্থী নেই।</p></section>'; return html; }
  if(!published){
    html += '<p style="margin:0"><b>এই তারিখে এই ক্লাসের হাজিরা এখনো পাবলিশ হয়নি।</b></p>'

    + '<button type="button" class="btn wide" data-act="pwa-install">'+icon("phone","sm")+" এখনই ইনস্টল করুন</button>";
  body += '<h3 style="margin:18px 0 4px">APK ইনস্টলের ধাপ — সহজ করে</h3>'
    + "<ol class='steps'>"

    + "<li>মাঝে ফোন যদি বলে <b>অজানা উৎস থেকে ইনস্টলের অনুমতি নেই</b> — ভয় পাবেন না, এটা স্বাভাবিক। ওই লেখার পাশের <b>Settings</b> বোতামে চাপ দিন, তারপর <b>এই উৎস থেকে অনুমতি দিন (Allow from this source)</b> লেখাটার পাশের বোতামটা <b>অন</b> করে দিন।</li>"

/* Clipboard fallback for the backup copy: select the sheet's readonly
   textarea and copy with execCommand (works in WebViews where the
   async Clipboard API is unavailable). No render() here — rebuilding
   the sheet would lose the selection. */
function copyBackupFallback(text){
  try{
    var ta = document.getElementById("backupJsonText");
    if(ta){ ta.focus(); ta.select(); }
    if(document.execCommand("copy")){ toast("ব্যাকআপ কপি হয়েছে — নোটসে পেস্ট করে রাখুন"); return; }
  }catch(e){}
  toast("কপি করা যায়নি — লেখাটা হাতে ধরে সিলেক্ট করে কপি করুন");
}

/* Generic clipboard fallback: a temporary textarea + execCommand, for
   WebViews where the async Clipboard API is unavailable. Returns true
   when the copy worked (and toasts the success message itself). */
function copyTextFallback(text, okMsg){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e2){}
    document.body.removeChild(ta);
    if(ok){ toast(okMsg); return true; }
  }catch(e){}
  return false;
}

/* The backup sheet: the backup JSON is shown INSIDE the app, in a
   readonly textarea, instead of starting a file download. The old
   behaviour (Blob URL + a.click() download) made the installed APK
   leave the app: its DownloadListener hands the blob: URL to Android
   DownloadManager, which cannot fetch blob: URLs. So the primary
   path here never triggers a download — copy is the way to take the
   backup out of the app. The secondary "ডাউনলোড করুন" button keeps
   the old blob download for Chrome users only, and is clearly
   labelled as such. The sheet is rendered from ui.sheet/ui.backupJson
   by render(), so a Firebase sync re-render keeps it open, and
   closing it only clears ui.sheet/ui.backupJson — it never logs the
   user out and never wipes any other state. */
function backupSheetHtml(){
  var json = ui.backupJson || "";
  var body = '<div class="sheet-scrim" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-label="ব্যাকআপ দেখুন">'
    + '<h2>'+icon("download")+' ব্যাকআপ (JSON)<button type="button" class="close-x" data-act="close-sheet" aria-label="বন্ধ করুন">'+icon("x","sm")+"</button></h2>"
    + '<p class="dim small">ব্যাকআপটা অ্যাপের ভিতরেই দেখা যাচ্ছে — ডাউনলোডের জন্য অ্যাপ থেকে বের হতে হবে না। <b>কপি করুন</b> চাপ দিয়ে পুরো ব্যাকআপটা কপি করে নোটস বা যেকোনো জায়গায় পেস্ট করে রাখুন। ব্যাকআপে ফোন নম্বরও থাকে, তাই এটা কারো সাথে শেয়ার করবেন না।</p>'
    + '<textarea id="backupJsonText" readonly aria-label="ব্যাকআপ JSON" style="width:100%;min-height:220px;font-size:12px;font-family:monospace;white-space:pre">'+esc(json)+"</textarea>"
    + '<div class="row-btns" style="margin-top:10px"><button type="button" class="btn gold" data-act="copy-backup">'+icon("copy","sm")+" কপি করুন</button>"
    + '<button type="button" class="btn ghost" data-act="download-backup">'+icon("download","sm")+" ডাউনলোড করুন (ব্রাউজারে)</button>"
    + '<button type="button" class="btn ghost" data-act="close-sheet">বন্ধ করুন</button></div>'
    + "</div></div>";
  return body;
}

/* ---------------- in-app camera ----------------
   The 📷 ক্যামেরা buttons do NOT use a file input: Android WebView
   does not honour the capture attribute, so a capture file input
   fell through to the gallery chooser in APK v1.0.4. This sheet
   instead shows the live camera inside the app via getUserMedia
   (APK v1.0.5+ grants VIDEO_CAPTURE in MainActivity). "ছবি তুলুন"
   draws the video frame to a canvas (max 800px, JPEG 0.8) and feeds
   it into the same handlePhotoFile() as a gallery pick, so the
   preview/save flow is identical. The stream is stopped on capture,
   on cancel, and whenever the sheet closes. If the camera cannot
   start (no camera / permission denied), the sheet STAYS OPEN with a
   clear Bengali message and an "আবার চেষ্টা করুন" retry button —
   v1.0.6 asks for the Android CAMERA permission at tap time, so the
   retry re-asks it inside the app (no Settings digging). Only after
   a SECOND consecutive failure does the sheet close and the gallery
   picker open instead. */
var cameraStream=null, cameraStarting=false, cameraFailCount=0;
function cameraSheetHtml(){
  var body = '<div class="sheet-scrim" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-label="ক্যামেরা">'
    + '<h2>📷 ক্যামেরা<button type="button" class="close-x" data-act="camera-cancel" aria-label="বন্ধ করুন">'+icon("x","sm")+"</button></h2>"
    + '<p class="dim small" style="margin:0 0 10px">ছবিটা ক্যামেরায় দেখে "ছবি তুলুন" চাপুন — তোলা ছবিটা সরাসরি এখানে বসে যাবে।</p>'
    + '<video id="cameraVideo" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;min-height:200px"></video>'
    + '<p class="dim small" id="cameraStatus" style="margin:8px 0 0">ক্যামেরা চালু হচ্ছে…</p>'
    + '<div class="row-btns" style="margin-top:10px"><button type="button" class="btn gold" data-act="camera-capture">📸 ছবি তুলুন</button>'
    + '<button type="button" class="btn gold" id="cameraRetryBtn" data-act="camera-retry" style="display:none">আবার চেষ্টা করুন</button>'
    + '<button type="button" class="btn ghost" data-act="camera-cancel">বাতিল</button></div>'
    + "</div></div>";
  return body;
}
function attachCameraVideo(){
  var v=document.getElementById("cameraVideo");
  if(v && cameraStream){ try{ v.srcObject=cameraStream; v.play().catch(function(){}); }catch(e){} }
}
function stopCameraStream(){
  if(cameraStream){ try{ cameraStream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }catch(e){} cameraStream=null; }
  cameraStarting=false;
  var v=document.getElementById("cameraVideo");
  if(v){ try{ v.srcObject=null; }catch(e){} }
}
function closeCameraSheetFallback(){
  ui.sheet=null;
  stopCameraStream();
  render();
  ensurePhotoInput();
  photoInput.click();
}
function startCameraStream(){
  if(cameraStream){ attachCameraVideo(); return; }
  if(cameraStarting) return;
  if(!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia!=="function"){
    toast("ক্যামেরা খোলা যায়নি — গ্যালারি থেকে ছবি বেছে নিন");
    closeCameraSheetFallback();
    return;
  }
  cameraStarting=true;
  function onCamOk(stream){
    cameraStarting=false; cameraStream=stream; attachCameraVideo();
    var st=document.getElementById("cameraStatus"); if(st) st.textContent="ক্যামেরা চালু আছে — ছবি তুলুন";
  }
  function onCamFail(){
    cameraStarting=false;
    cameraFailCount++;
    if(cameraFailCount>=2){
      toast("ক্যামেরা খোলা যায়নি — গ্যালারি থেকে ছবি বেছে নিন");
      closeCameraSheetFallback();
      return;
    }
    /* First failure: keep the sheet open so the admin can retry
       (APK v1.0.6 re-asks the CAMERA permission at tap time). */
    var st=document.getElementById("cameraStatus");
    if(st) st.textContent="ক্যামেরার অনুমতি দেওয়া হয়নি — আবার চেষ্টা করুন";
    var rb=document.getElementById("cameraRetryBtn");
    if(rb){ try{ rb.style.display=""; }catch(e){} }
    toast("ক্যামেরার অনুমতি দেওয়া হয়নি — আবার চেষ্টা করুন");
  }
  try{
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false }).then(onCamOk).catch(function(){
      try{ navigator.mediaDevices.getUserMedia({ video:true, audio:false }).then(onCamOk).catch(onCamFail); }catch(e){ onCamFail(); }
    });
  }catch(e){ onCamFail(); }
}
function openCameraSheet(){
  ui.sheet="camera";
  cameraFailCount=0;
  render();
  startCameraStream();
}
function retryCameraStream(){
  /* Retry from the sheet: do NOT reset cameraFailCount — a second
     consecutive failure must fall back to the gallery. Start the
     stream again (the native permission prompt is asked again by
     APK v1.0.6). Do NOT re-render — the sheet is already open and
     pendingPhotoKind must survive. */
  var st=document.getElementById("cameraStatus");
  if(st) st.textContent="ক্যামেরা চালু হচ্ছে…";
  var rb=document.getElementById("cameraRetryBtn");
  if(rb){ try{ rb.style.display="none"; }catch(e){} }
  startCameraStream();
}
function captureCameraPhoto(){
  var v=document.getElementById("cameraVideo");
  if(!cameraStream || !v || !v.videoWidth){
    toast("ক্যামেরা এখনো চালু হচ্ছে — একটু অপেক্ষা করে আবার চাপুন");
    return;
  }
  /* ID-card scans capture at higher resolution so the OCR can read small Bengali text. */
  var maxW=idcardScanActive()?1600:800, scale=v.videoWidth>maxW?maxW/v.videoWidth:1;
  var cv=document.createElement("canvas");
  cv.width=Math.max(1, Math.round(v.videoWidth*scale));
  cv.height=Math.max(1, Math.round(v.videoHeight*scale));
  var cx=cv.getContext("2d");
  if(!cx){ toast("ছবি তোলা যায়নি — আবার চেষ্টা করুন"); return; }
  cx.drawImage(v,0,0,cv.width,cv.height);
  var kind=pendingPhotoKind||"student";
  stopCameraStream();
  ui.sheet=null;
  render();
  function done(blob){
    if(!blob){ toast("ছবি তোলা যায়নি — আবার চেষ্টা করুন"); return; }
    var f;
    try{ f=new File([blob], "camera.jpg", { type:"image/jpeg" }); }
    catch(e){ f=blob; try{ f.name="camera.jpg"; }catch(e2){} }
    pendingPhotoKind=kind;
    handlePhotoFile(f);
  }
  try{ cv.toBlob(done, "image/jpeg", 0.8); }catch(e){ toast("ছবি তোলা যায়নি — আবার চেষ্টা করুন"); }
}

/* ---------------- complaint box (private) ----------------
   Complaints are admin-only. They are stored ONLY in the private
   Firebase node: a guardian phone writes its own complaint child
   (private/complaints/<id>) and never reads the node, so no guardian
   can see another guardian's complaint. The submitting phone keeps
   its own complaints locally and re-reads just those ids to pick up
   the admin's reply. Admins get the full list from the private node,
   and can reply or delete. */
function pushComplaintToPrivate(c){
  var payload = { id:c.id, name:c.name, phone:c.phone||"", className:c.className||"", text:c.text, createdAt:c.createdAt, reply:c.reply||"", repliedAt:c.repliedAt||"" };
  if(fbPriv && !restMode){
    try{ fbPriv.child("complaints").child(c.id).set(payload).catch(function(){}); return; }catch(e){}
  }
  var base = fcmDbBase();
  if(base){
    fetch(base + "/madrasaApp/v1/private/complaints/" + c.id + ".json", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).catch(function(){});
  }
}
var ownComplaintsChecked = false;
function pushDeletionToPrivate(r){
  var payload = { id:r.id, name:r.name, phone:r.phone||"", childName:r.childName||"", className:r.className||"", reason:r.reason||"", createdAt:r.createdAt };
  if(fbPriv && !restMode){
    try{ fbPriv.child("deletionRequests").child(r.id).set(payload).catch(function(){}); return; }catch(e){}
  }
  var base = fcmDbBase();
  if(base){
    fetch(base + "/madrasaApp/v1/private/deletionRequests/" + r.id + ".json", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
    }).catch(function(){});
  }
}
var ownComplaintsChecked = false;
function fetchOwnComplaintReplies(){
  if(ownComplaintsChecked || isAdmin() || !D.complaints.length) return;
  var base = fcmDbBase();
  if(!base) return;
  ownComplaintsChecked = true;
  var changed = false;
  var chain = Promise.resolve();
  D.complaints.slice(0, 20).forEach(function(c){
    chain = chain.then(function(){
      return fetch(base + "/madrasaApp/v1/private/complaints/" + c.id + ".json", { cache: "no-store" })
        .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
        .then(function(srv){
          if(srv === null){
            // Deleted by the admin — drop it from this phone's list too.
            D.complaints = D.complaints.filter(function(x){ return x.id !== c.id; });
            changed = true;
          } else if(srv && (srv.reply || "") !== (c.reply || "")){
            c.reply = srv.reply || ""; c.repliedAt = srv.repliedAt || "";
            changed = true;
          }
        }).catch(function(){});
    });
  });
  chain.then(function(){ if(changed){ persistLocal(); if(ui.tab === "complaints") render(); } });
}

/* ---------------- শিক্ষক বার্তা (teachers-only) ----------------
   Head/primary admin posts a message for ALL teachers (admins + the
   other ~10 teachers). Guardians NEVER see these messages.
   - Storage: ONLY the private Firebase node ("private/teacherMessages").
     publicData() strips them, so they never ride the public node.
   - Teacher identity: phone-number match only (no password) against the
     phone stored in the teacher profile. On a teacher's own phone the
     numbers are not in the public node, so login also pulls ONLY the
     private phones index + teacherMessages over REST to verify.
   - Every teacher can reply under a message (opinion / question). */
function teacherMessagesToArray(m){
  var arr = [];
  if(Array.isArray(m)) arr = m.filter(Boolean);
  else if(m && typeof m === "object") Object.keys(m).forEach(function(k){ if(m[k]) arr.push(m[k]); });
  arr.forEach(function(x){ if(!Array.isArray(x.replies)) x.replies = []; });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
function normalizePhone(ph){
  var d = String(ph || "").replace(/\D/g, "");
  if(d.indexOf("880") === 0) d = d.slice(3);
  if(d.charAt(0) === "0") d = d.slice(1);
  return d;
}
function findTeacherByPhoneLocal(ph){
  var n = normalizePhone(ph);
  if(!n) return null;
  var found = null;
  (D.teachers || []).forEach(function(x){ if(x.phone && normalizePhone(x.phone) === n) found = x; });
  return found;
}

function fetchTeacherMessagesForTeacher(done){
  // Teacher's own phone: pull ONLY the private phones index + the
  // teacher messages over REST (never the whole private node, which
  // also holds the admin accounts).

var GM_TEMPLATES = [

function guardianMessagesToArray(m){
  var arr = [];
  if(!m) return arr;
  if(Array.isArray(m)) arr = m.filter(Boolean);
  else if(m && typeof m === "object") Object.keys(m).forEach(function(ph){
    var bucket = m[ph];
    if(Array.isArray(bucket)) bucket.forEach(function(x){ if(x) arr.push(x); });
    else if(bucket && typeof bucket === "object") Object.keys(bucket).forEach(function(k){ if(bucket[k]) arr.push(bucket[k]); });
  });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
/* The number a message/call goes to for one student: the admin's
   chosen number when it is linked, else the FIRST (main) number. */
function guardianPhoneForStudent(st, preferred){
  var list = studentGuardianPhones(st);
  var pref = normPhone(preferred||"");
  if(pref && list.indexOf(pref)>=0) return pref;
  return list[0] || "";
}
function myGuardianMessages(){
  if(!isGuardian()) return [];

}
function guardianUnreadCount(){

     never unread for them. */

}
/* Live chat directions (v1.0.16): one conversation in
   private/guardianMessages/<phone> holds BOTH sides. direction
   "guardian" = written by the guardian, "admin" = written by the
   admin. Messages WITHOUT a direction field are old admin messages
   (written before v1.0.16) — missing direction ALWAYS means admin,
   so old messages render and count exactly as before. */
function gmDirection(m){ return (m && m.direction === "guardian") ? "guardian" : "admin"; }
/* Admin-side chat unread: guardian-direction messages the admin has
   not read yet — across all conversations (tab badge) or one phone
   (conversation-list row). */
function adminChatUnreadCount(){
  if(!isAdmin()) return 0;
  var n = 0;
  guardianMessagesToArray(D.guardianMessages || {}).forEach(function(x){
    if(gmDirection(x)==="guardian" && !x.read) n++;
  });
  return n;
}
function adminChatUnreadForPhone(ph){
  if(!isAdmin()) return 0;
  var n = 0;
  var bucket = (D.guardianMessages||{})[normPhone(ph||"")] || {};
  Object.keys(bucket).forEach(function(id){
    var m = bucket[id];
    if(m && gmDirection(m)==="guardian" && !m.read) n++;
  });
  return n;
}
/* Opening an admin thread marks that guardian's guardian-direction
   messages read (their read flag means "the admin has read it"). */
function markGuardianChatRead(ph){
  if(!isAdmin()) return;
  var bucket = (D.guardianMessages||{})[normPhone(ph||"")] || {};
  var changed = false;
  Object.keys(bucket).forEach(function(id){
    var m = bucket[id];
    if(m && gmDirection(m)==="guardian" && !m.read){ m.read = true; changed = true; pushGuardianMessageToPrivate(m); }
  });

/* ---------------- admin "new opinion / complaint" badges ----------------
   Guardians write মতামত (public node) and অভিযোগ (private node); the
   admin only finds out by opening the tab — there is NO push for these
   and there cannot be one without a server (no Blaze/card, and the
   OneSignal REST key must never live in the app). So the admin gets an
   in-app unread badge instead: per-device "seen" timestamps in
   localStorage, the newest createdAt the admin has seen on this phone.
   Items WITHOUT a createdAt never count (old/legacy data can never
   badge forever). ADMIN-ONLY: guardians must never see a complaint
   count — they do not load the private complaints node anyway. */
var OPINIONS_SEEN_KEY = "madrasa-opinions-seen";
var COMPLAINTS_SEEN_KEY = "madrasa-complaints-seen";
function newestCreatedAt(items){
  var newest = "";
  (items||[]).forEach(function(x){ var c = x && x.createdAt ? String(x.createdAt) : ""; if(c && (!newest || c > newest)) newest = c; });
  return newest;
}
function getSeenStamp(key){
  try{ var v = localStorage.getItem(key); return v === null ? "" : v; }catch(e){ return ""; }
}
function setSeenStamp(key, v){
  try{ localStorage.setItem(key, v || ""); }catch(e){}
}
function opinionsUnreadCount(){
  if(!isAdmin() || !D) return 0;
  var seen = getSeenStamp(OPINIONS_SEEN_KEY);
  return (D.opinions||[]).filter(function(o){ return o && o.createdAt && String(o.createdAt) > seen; }).length;
}
function complaintsUnreadCount(){
  if(!isAdmin() || !D) return 0;
  var seen = getSeenStamp(COMPLAINTS_SEEN_KEY);
  return (D.complaints||[]).filter(function(c){ return c && c.createdAt && String(c.createdAt) > seen; }).length;
}
/* Opening the মতামত / অভিযোগ tab marks everything there seen — call
   from render() and renderTabSwitch() before the tab bar is built, so
   the badge clears in the same switch. */
function markOpinionsComplaintsSeen(){
  if(!isAdmin() || !D) return;
  if(ui.tab==="opinions"){ var n = newestCreatedAt(D.opinions); if(n) setSeenStamp(OPINIONS_SEEN_KEY, n); }
  else if(ui.tab==="complaints"){ var m = newestCreatedAt(D.complaints); if(m) setSeenStamp(COMPLAINTS_SEEN_KEY, m); }
}
var guardianMsgLoaded = false, guardianMsgLoading = false;
var guardianChatPollTimer = null;
function fetchGuardianMessages(done, force){
  if(!isGuardian() || !guardianPhone){ if(done) done(); return; }
  if(!force && guardianMsgLoaded){ if(done) done(); return; }
  if(guardianMsgLoading){ if(done) done(); return; }
  var base = fcmDbBase();
  if(!base){ if(done) done(); return; }
  guardianMsgLoading = true;
  var ph = normPhone(guardianPhone);
  fetch(base + "/madrasaApp/v1/private/guardianMessages/" + ph + ".json", { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(val){
      guardianMsgLoading = false; guardianMsgLoaded = true;
      if(!D.guardianMessages || typeof D.guardianMessages !== "object") D.guardianMessages = {};
      if(val) D.guardianMessages[ph] = val;
      persistLocal();
      if(done) done();
      /* renderFromSync (not render): the typing hold means a poll
         never rebuilds the DOM under the guardian's fingers. */
      renderFromSync();
    })
    .catch(function(){ guardianMsgLoading = false; if(done) done(); });
}
/* Live chat (v1.0.16): while the guardian has the বার্তা tab open,
   re-fetch their own subtree every ~15s so the admin's reply appears
   without reopening the tab. One timer at most; it re-schedules
   itself after each poll and stops when the tab is left (the goto
   handler clears it). */
function scheduleGuardianChatPoll(){
  if(guardianChatPollTimer) return;
  guardianChatPollTimer = setTimeout(function(){
    guardianChatPollTimer = null;
    if(ui.tab==="guardianmsg" && isGuardian()){
      fetchGuardianMessages(function(){ scheduleGuardianChatPoll(); }, true);
    }
  }, 15000);
}
function stopGuardianChatPoll(){
  if(guardianChatPollTimer){ clearTimeout(guardianChatPollTimer); guardianChatPollTimer = null; }
}
function markGuardianMessagesRead(){
  if(!isGuardian()) return;
  var ph = normPhone(guardianPhone);
  /* Live chat: only ADMIN-direction messages are "unread" for the
     guardian — the guardian's own messages are marked read by the
     admin's thread view instead (their read flag means the admin
     has read them). */
  var list = myGuardianMessages().filter(function(x){ return gmDirection(x)==="admin" && !x.read; });
  if(!list.length) return;
  var base = fcmDbBase();
  list.forEach(function(m){
    m.read = true;
    if(base){
      fetch(base + "/madrasaApp/v1/private/guardianMessages/" + ph + "/" + m.id + ".json", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(m)
      }).catch(function(){});
    }
  });
  persistLocal();
}
function pushGuardianMessageToPrivate(m){

  /* Live chat (v1.0.16): new messages always carry a direction.
     Old messages have none — leave them direction-less on re-PUT
     (missing direction already means "admin"); never rewrite them. */

  if(fbPriv && !restMode){

  }
  var base = fcmDbBase();
  if(base){
    fetch(base + "/madrasaApp/v1/private/guardianMessages/" + m.guardianPhone + "/" + m.id + ".json", {

  }
}

/* In-memory only: bot-answered questions live here, never in D and
   never in Firebase — a reload clears them, which is fine: the
   guardian can ask again and the bot answers again. */
var helpBotLocal = [];
var helpBotSeq = 0;
function helpBotNormalize(text){
  return String(text||"").replace(/[^\u0980-\u09FFa-zA-Z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function helpBotKeyMatches(q, words, k){
  var kk = helpBotNormalize(k);
  if(!kk) return false;
  if(kk.indexOf(" ") >= 0) return q.indexOf(kk) >= 0;
  var i;
  if(kk.length <= 2){
    for(i=0;i<words.length;i++){ if(words[i] === kk) return true; }
    return false;
  }
  for(i=0;i<words.length;i++){ if(words[i].indexOf(kk) === 0) return true; }
  return false;
}
function helpBotFindAnswer(text){
  var q = helpBotNormalize(text);
  if(!q) return "";
  var words = q.split(" ");
  var best = "", bestScore = 0;
  HELP_FAQS.forEach(function(f){
    var score = 0;
    f.keys.forEach(function(k){ if(helpBotKeyMatches(q, words, k)) score++; });
    if(score > bestScore){ bestScore = score; best = f.answer; }
  });
  return best;
}
function helpBotAddLocal(question, answer){
  var now = new Date().toISOString();
  helpBotLocal.push({ id:"botq-" + (++helpBotSeq), text:question, bot:"q", createdAt:now });
  helpBotLocal.push({ id:"bota-" + (++helpBotSeq), text:answer, bot:"a", createdAt:now });
}

    if(!ph) return;
    if(!byPhone[ph]) byPhone[ph] = { phone:ph, latest:m, unread:0, count:0 };

    if(gmDirection(m)==="guardian" && !m.read) byPhone[ph].unread++;

  var rows = Object.keys(byPhone).map(function(ph){ return byPhone[ph]; });
  rows.sort(function(a,b){ return String(b.latest.createdAt||"").localeCompare(String(a.latest.createdAt||"")); });
  return rows;

/* ---------------- ইন্টারনেট কল (v1.0.17) ----------------
   Admin calls ONE guardian from inside the app, over the internet
   (WebRTC voice, audio-only) — free, no SIM balance, no phone
   number sharing: the guardian's number never leaves the admin's
   view (it is already on the student record).
   Signalling rides the SAME private Firebase node as guardian
   messages: private/calls/<guardianPhoneDigits>/<callId>. The
   caller (admin) writes the offer + ICE candidates; the callee
   (guardian) writes the answer + ICE candidates. Status moves
   ringing -> answered | declined | missed, then ended. Calls are
   written with targeted PUTs (putCallRecord) and preserved by
   privateData(D) / mergePrivate, exactly like guardianMessages —
   whole-node save() never drops them.
   CLOSED APP (v1.0.17, PIGGYBACK — no money, no extra battery,
   no server): a call can also ring when the guardian's app is
   CLOSED / the screen is locked — but NOT instantly. The APK
   already wakes the phone about every 5 minutes for the
   opinion / message / notice checks (GuardianMessageReceiver);
   that same wake now also does ONE extra GET of the calls node
   for the stored guardian phone (CallCheck.check, same
   goAsync + wake lock, same re-arm, no new alarm cadence, no
   foreground service, no polling loop — essentially zero extra
   battery). A ringing call inside its 10-minute window posts
   the same full-screen incoming-call screen with ringtone.
   That is why the ring window is 10 minutes: the next ~5-min
   check must have time to catch the call, plus time for the
   guardian to answer. HONEST LIMIT (told to the user, do NOT
   fake it): typical latency is one poll cycle (~5 min) when
   the phone is awake, longer in Doze — the same profile as
   the opinion / message alarm. Instant ringing would need a
   paid push server, SMS, or battery-hungry polling, and the
   user rejected all three. The OneSignal nudge stays on the
   calling screen as a manual extra push, not as the ring
   itself.
   ICE: Google's free public STUN only — no TURN server exists, so
   on some strict networks (symmetric NAT) the audio may fail to
   connect even though the ringing worked. That is a network limit,
   not an app bug; it will be found by testing on two real phones.
   Ringtone: Web Audio two-tone chime + vibration. If the browser
   blocks audio (no user gesture yet on this phone), the chime
   stays silent and the flashing incoming screen + vibration are
   the ring. No audio file is added — the page stays
   self-contained. */
var CALL_ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  { urls: "stun:stun2.l.google.com:19302" },
  { urls: "stun:stun3.l.google.com:19302" }
];
var CALL_RING_SECONDS = 600;
var CALL_POLL_MS = 3000;
var CALL_STATUSES = ["ringing","answered","declined","ended","missed"];
/* --- pure helpers (unit-tested in test-internet-call.js) --- */
function callIsValidStatus(s){ return CALL_STATUSES.indexOf(s) >= 0; }
function callNewId(){ return "call-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function callIsRinging(c){ return !!c && c.status === "ringing"; }
function callIsLive(c){ return !!c && (c.status === "ringing" || c.status === "answered"); }
function callIsExpired(c, nowMs){
  if(!callIsRinging(c)) return false;
  var t = Date.parse(c.createdAt || "");
  if(!isFinite(t)) return false;
  return (nowMs - t) > CALL_RING_SECONDS * 1000;
}
/* Pure state machine: the ONLY legal moves. Terminal states
   (declined/ended/missed) never move again — a late answer to a
   call that already timed out is ignored, not resurrected. */
function callNextStatus(c, event){
  if(!c || !callIsValidStatus(c.status)) return null;
  if(c.status === "ringing"){
    if(event === "answer") return "answered";
    if(event === "decline") return "declined";
    if(event === "miss" || event === "timeout") return "missed";
    if(event === "end") return "ended";
  }
  if(c.status === "answered" && event === "end") return "ended";
  return null;
}
function callsToArray(calls){
  var arr = [];
  if(!calls) return arr;
  if(Array.isArray(calls)) arr = calls.filter(Boolean);
  else if(typeof calls === "object") Object.keys(calls).forEach(function(ph){
    var bucket = calls[ph];
    if(bucket && typeof bucket === "object") Object.keys(bucket).forEach(function(k){ if(bucket[k]) arr.push(bucket[k]); });
  });
  arr.sort(function(a, b){ return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  return arr;
}
/* Newest live call for one guardian phone, or null. Expired ringing
   calls (older than 10 minutes) do NOT count — the admin's timer has
   already marked them missed. */
function callLiveForPhone(calls, ph, nowMs){
  var list = callsToArray(calls).filter(function(c){ return normPhone(c.guardianPhone || "") === normPhone(ph || ""); });
  var i, c;
  for(i=0;i<list.length;i++){ c = list[i]; if(callIsLive(c) && !callIsExpired(c, nowMs)) return c; }
  return null;
}
/* The one call the guardian should be ringing for right now: the
   newest ringing (not yet answered) call for their phone that is
   still inside its 10-minute window. */
function callIncomingForPhone(calls, ph, nowMs){
  var list = callsToArray(calls).filter(function(c){ return normPhone(c.guardianPhone || "") === normPhone(ph || ""); });
  var i, c;
  for(i=0;i<list.length;i++){
    c = list[i];
    if(c.status === "ringing" && !callIsExpired(c, nowMs)) return c;
  }
  return null;
}
function callRecordFor(student, admin, phone){
  var ph = guardianPhoneForStudent(student, phone);
  var now = new Date().toISOString();
  return {
    id: callNewId(), guardianPhone: ph,
    studentId: student.id || "", studentName: student.name || "",
    className: student.className || "", roll: student.roll || "",
    fromAdminName: (admin && admin.name) || "অ্যাডমিন",
    fromAdminPhone: (admin && admin.phone) || "",
    status: "ringing", offer: null, answer: null,
    callerCandidates: [], calleeCandidates: [],
    createdAt: now, updatedAt: now, endedAt: "", endedBy: ""
  };
}
function callPayload(c){
  return {
    id: c.id, guardianPhone: c.guardianPhone,
    studentId: c.studentId || "", studentName: c.studentName || "",
    className: c.className || "", roll: c.roll || "",
    fromAdminName: c.fromAdminName || "", fromAdminPhone: c.fromAdminPhone || "",
    status: c.status, offer: c.offer || null, answer: c.answer || null,
    callerCandidates: c.callerCandidates || [], calleeCandidates: c.calleeCandidates || [],
    createdAt: c.createdAt || "", updatedAt: c.updatedAt || "",
    endedAt: c.endedAt || "", endedBy: c.endedBy || ""
  };
}
/* The text left in the guardian's বার্তা thread when a call rings
   10 minutes with no answer. It is an admin-direction message (direction
   "admin", callMissed:true), so it badges and reads like any admin
   message — only this guardian sees it. */
function callMissedMessageText(c){
  var who = c.fromAdminName || "অ্যাডমিন";
  var child = c.studentName ? (" (" + c.studentName + ")") : "";
  return "📞 মিসড কল — " + who + " আপনাকে কল করেছিলেন" + child + "। কলটি বাজেনি (অ্যাপ বন্ধ ছিল বা সাড়া পাওয়া যায়নি)। পরেরবার অ্যাপ খোলা রাখলে কল বাজবে।";
}
function callCanStart(student){
  return !!student && studentGuardianPhones(student).length>0;
}
/* ---------------- guardian contact row (v1.0.18, multi-number) --------
   One row of contact options per LINKED guardian number (admin-only).
   The admin picks whichever fits the moment:
     📞 অ্যাপ কল — the in-app internet call (WebRTC, free);
     📱 ডায়াল কল — tel: opens the phone dialer (normal call);
     WhatsApp — wa.me/<880...> opens the WhatsApp CHAT with that
       guardian; the admin taps call inside WhatsApp. There is NO
       official WhatsApp direct-call link — do not invent one.
     imo — best effort ONLY: opens the imo APP (no per-contact
       imo call/chat link exists anywhere, so this cannot open a
       specific chat; the admin finds the contact inside imo).
       Needs the native intent handler (MainActivity, v1.0.18);
       without it the button does nothing in the installed app.
     💬 মেসেজ — the existing per-guardian chat thread;
     ✉️ SMS — sms: opens the phone's SMS app (1 SMS only if the
       admin actually sends).
   The row renders ONLY for the admin and ONLY when the student
   has at least one guardian number saved — one row per number,
   each labelled with its number; otherwise a dim note explains it.
   The phone number never renders for non-admins. */
var IMO_INTENT_URL = "intent://#Intent;package=com.imo.android.imoim;end";
function contactWaNumber(ph){

      + '<a class="mini-btn" style="text-decoration:none;color:inherit" href="'+esc(IMO_INTENT_URL)+'" title="imo খুলবে — ভেতর থেকে খুঁজে কল করুন">imo</a>'
      + (o.inThread ? "" : '<button type="button" class="mini-btn" data-act="gm-open-thread" data-phone="'+esc(ph)+'">💬 মেসেজ</button>')
      + '<a class="mini-btn" style="text-decoration:none;color:inherit" href="sms:'+esc(ph)+'">✉️ SMS</a>'
      + '</div></div>';
    return h;
  }).join("");
}

/* ---------------- group meetings (Jitsi Meet, free, v1.0.18) --------
   A live group conference — ALL guardians together, or ALL teachers
   together, audio + video — with NO server, NO account, NO key and
   NO money: the meeting runs on Jitsi's free public instance
   (meet.jit.si), embedded in the app through the Jitsi External API.
   Honest limits (do not promise more):
   - The PUBLIC Jitsi instance carries the meeting: traffic passes
     through Jitsi's free servers, rooms are NOT end-to-end encrypted
     by default, and anyone who learns the room name can try to join
     — the per-meeting password (below) is the barrier, not a wall.
   - Quality depends on each phone's internet; a big group on weak
     data will be choppy. There is no recording and no moderation
     beyond Jitsi's own controls.
   - The meeting needs this phone's camera + mic: they come through
     the existing WebView permission prompt (v1.0.6/v1.0.17) — one tap
     to allow, at join time. If the Jitsi script cannot load (no
     internet when joining), the in-app frame falls back to a plain
     Jitsi iframe, and a "ব্রাউজারে খুলুন" link opens the meeting in
     the system browser instead (native intent, v1.0.18).
   Data: one record per meeting in D.meetings (PUBLIC node — the
   participants need the room id; the record holds NO phone numbers):
     {roomId, kind:"guardians"|"teachers", startedBy, startedAt,
      status:"live"|"ended", password}
   Room names are unique per meeting (date-time + random suffix) and
   never a fixed guessable name. The live card appears on the home
   tab ONLY for the meeting's own group (guardians never see teacher
   meetings and vice versa); the admin starts/ends from
   Admin → 📹 মিটিং and joins from there too. While a meeting view
   is open, sync re-renders are held (renderFromSync guard) so the
   Jitsi iframe is never destroyed under a live meeting. */
var JITSI_BASE = "https://meet.jit.si";
var MEETING_KINDS = {guardians:"গার্জিয়ানদের", teachers:"শিক্ষকদের"};
function meetingKindLabel(kind){ return MEETING_KINDS[kind] || kind; }
function makeMeetingId(kind){
  var d = new Date();
  function p(n){ return (n<10?"0":"") + n; }
  var stamp = d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  var rnd = (Math.random().toString(36).slice(2) + "xxxxxx").slice(0, 6);
  return "mahmudia-" + kind + "-" + stamp + "-" + rnd;
}
function makeMeetingPassword(){
  var chars = "abcdefghjkmnpqrstuvwxyz23456789", out = "";
  for(var i=0;i<6;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
function buildMeetingRecord(kind, startedBy){
  return {roomId: makeMeetingId(kind), kind: kind, startedBy: startedBy || "অ্যাডমিন",
    startedAt: new Date().toISOString(), status: "live", password: makeMeetingPassword()};
}
function meetingsToArray(v){ return toArraySorted(v, "startedAt"); }
function liveMeetings(kind){
  return meetingsToArray(D.meetings).filter(function(m){ return m && m.status === "live" && (!kind || m.kind === kind); });
}
function meetingByRoom(roomId){
  var all = meetingsToArray(D.meetings), i;
  for(i=0;i<all.length;i++){ if(all[i] && all[i].roomId === roomId) return all[i]; }
  return null;
}
function meetingDisplayName(){
  if(isAdmin()){ var a = currentAdmin(); return (a && a.name) || "অ্যাডমিন"; }
  if(isTeacher()) return (ui.teacherName || "শিক্ষক");
  if(isGuardian()){
    var kids = myChildren();
    if(kids && kids.length) return (kids[0].name || "") + " (গার্জিয়ান)";
    return "গার্জিয়ান";
  }
  return "অতিথি";
}
function meetingStart(kind){
  if(!isAdmin()) return "";
  if(kind !== "guardians" && kind !== "teachers") kind = "guardians";
  var me = currentAdmin();
  var m = buildMeetingRecord(kind, (me && me.name) || "অ্যাডমিন");
  if(!Array.isArray(D.meetings)) D.meetings = meetingsToArray(D.meetings);
  D.meetings.push(m);
  save();
  ui.meetingView = m.roomId;
  return m.roomId;
}
function meetingEnd(roomId){
  if(!isAdmin()) return false;
  var m = meetingByRoom(roomId);
  if(!m) return false;
  m.status = "ended";
  save();
  if(ui.meetingView === roomId) closeMeetingView();
  return true;

/* The one poll for an in-flight call (both sides): the admin
   watches for answered / declined / ended and applies the
   guardian's answer + ICE candidates; the guardian watches for
   ended and applies the admin's ICE candidates. */
function callPollTick(){
  var c = callState.call;
  if(!c || !callState.pc) return;
  fetchCallBucket(c.guardianPhone).then(function(bucket){
    if(!callState.call || callState.call.id !== c.id) return;
    callMergeBucket(c.guardianPhone, bucket);
    var fresh = bucket ? callFindInBucket(bucket, c.id) : null;
    if(!fresh) return;
    callRefreshLocal(fresh);
    if(callState.role === "admin"){
      if(fresh.status === "answered" && fresh.answer){ callApplyAnswer(fresh); }
      else if(fresh.status === "declined"){ toast("গার্জিয়ান কলটি কেটে দিয়েছেন"); callCleanup(); return; }
      else if(fresh.status === "ended"){ toast("কল শেষ হয়েছে"); callCleanup(); return; }
      else if(fresh.status === "missed"){ callCleanup(); return; }
      if(callState.pc && callState.answerApplied){ callState.appliedCallee = callApplyCandidates(callState.pc, fresh.calleeCandidates, callState.appliedCallee); }
    } else if(callState.role === "guardian"){
      if(fresh.status === "ended"){ toast("কল শেষ হয়েছে"); callCleanup(); return; }
      if(callState.pc){ callState.appliedCaller = callApplyCandidates(callState.pc, fresh.callerCandidates, callState.appliedCaller); }
    }
  });
}
function callApplyAnswer(fresh){
  if(!callState.pc || callState.answerApplied || !fresh.answer) return;
  callState.answerApplied = true;
  try{
    var p = callState.pc.setRemoteDescription(new RTCSessionDescription(fresh.answer));
    if(p && p.then) p.then(function(){ if(callState.pc) callState.appliedCallee = callApplyCandidates(callState.pc, fresh.calleeCandidates, callState.appliedCallee); }).catch(function(){});
  }catch(e){}
  if(callState.ringTimer){ clearTimeout(callState.ringTimer); callState.ringTimer = null; }
  var c = callState.call;
  ui.callScreen = { role: "admin", phase: "talking", studentName: c.studentName, className: c.className || "", phone: c.guardianPhone, callId: c.id };
  render();
}
/* 10 minutes with no answer: mark the call missed (server truth is

function callMissTimeout(){
  var c = callState.call;
  if(!c || callState.role !== "admin" || c.status !== "ringing") return;
  fetchCallBucket(c.guardianPhone).then(function(bucket){
    var fresh = bucket ? callFindInBucket(bucket, c.id) : null;
    if(fresh && fresh.status === "answered"){ callRefreshLocal(fresh); callApplyAnswer(fresh); return; }
    if(fresh && fresh.status === "declined"){ toast("গার্জিয়ান কলটি কেটে দিয়েছেন"); callCleanup(); return; }
    if(fresh && fresh.status === "ended"){ callCleanup(); return; }
    if(!callState.call || callState.call.status !== "ringing") return;
    var now = new Date().toISOString();
    if(!callMarkMissed(c, now)) return;
    putCallRecord(c);
    var gm = { id: uid(), studentId: c.studentId, studentName: c.studentName, className: c.className || "", roll: c.roll || "", guardianPhone: c.guardianPhone, text: callMissedMessageText(c), sender: c.fromAdminName || "অ্যাডমিন", direction: "admin", createdAt: now, read: false, callMissed: true };

  });

/* --- guardian incoming-call poll: every 3s while a guardian

function scheduleCallGuardianPoll(){
  if(callGuardianPollTimer) return;
  if(!isGuardian() || !guardianPhone) return;
  callGuardianPollTimer = setTimeout(function(){
    callGuardianPollTimer = null;
    if(isGuardian() && guardianPhone){
      callGuardianPollTick();
      scheduleCallGuardianPoll();

  }, CALL_POLL_MS);
}

function callGuardianPollTick(){
  if(!isGuardian() || !guardianPhone) return;
  var ph = normPhone(guardianPhone);
  fetchCallBucket(ph).then(function(bucket){
    if(!isGuardian() || normPhone(guardianPhone) !== ph) return;
    callMergeBucket(ph, bucket);
    var nowMs = Date.now();
    var inc = callIncomingForPhone(D.calls, ph, nowMs);
    if(inc && !callState.pc){
      if(callIncomingId !== inc.id){
        callIncomingId = inc.id;
        ui.callIncoming = inc;
        callRingStart();
        renderFromSync();
      } else if(ui.callIncoming && ui.callIncoming.id === inc.id){
        /* Still the same ringing call — keep the overlay; the
           record may carry fresh ICE candidates already, which
           callAccept reads when the guardian answers. */
        ui.callIncoming = inc;
      }
    } else {
      /* No live ringing call for me: if the overlay is open for a
         call that has since ended / been missed / expired, close
         (and silence) it. */
      if(ui.callIncoming){
        ui.callIncoming = null;
        if(callIncomingId){ callIncomingId = ""; callRingStop(); }
        renderFromSync();
      }
    }
  });
}

/* ---------------- homework photos + result files (form pieces) ----------------
   Homework photos (max 3, images only) and result attachments (max 3,
   image/PDF/Word) live on pending lists in ui until the form is
   submitted — exactly like the notice attachment. Their preview rows
   update IN PLACE (no re-render), so text typed in the form is never
   wiped by adding or removing a file. The camera sheet DOES re-render
   (it is a full sheet), so snapshotFormDrafts() runs first and the
   form re-renders from the draft. */
function homeworkPhotoRowHtml(){
  var ps = ui.pendingHomeworkPhotos||[];
  if(!ps.length) return '<span class="dim small">এখনো কোনো ছবি যোগ করা হয়নি।</span>';
  return ps.map(function(p, i){
    return '<span style="position:relative;display:inline-block;margin:0 6px 6px 0"><img src="'+safeImg(p.data)+'" alt="হোমওয়ার্কের ছবি" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #ddd" />'
      + '<button type="button" class="mini-btn danger" data-act="hw-photo-remove" data-idx="'+i+'" style="position:absolute;top:-6px;right:-6px;padding:0 5px;border-radius:50%" aria-label="ছবি সরান">✕</button></span>';
  }).join("");
}
function updateHomeworkPhotoPreview(){
  var row=document.getElementById("hwPhotoRow");
  if(row) row.innerHTML = homeworkPhotoRowHtml();
}
function resultAttachRowHtml(){
  var atts = ui.pendingResultAttachments||[];
  if(!atts.length) return '<span class="dim small">এখনো কোনো ফাইল যোগ করা হয়নি।</span>';
  return atts.map(function(a, i){

      + ' <button type="button" class="mini-btn danger" data-act="result-attach-remove" data-idx="'+i+'" aria-label="ফাইল সরান">✕</button></span>';

}
function updateResultAttachPreview(){

}
/* Subjects the logged-in teacher teaches in the class currently
   picked in the result form. Admins get [] — the section is
   unchanged for them. The chips never block a subject either way. */
function resultSubjectMappedForCurrentClass(){
  if(!isTeacher()) return [];
  var clsList = teacherClasses();
  var cls = (ui.resultClass && clsList.indexOf(ui.resultClass)>=0) ? ui.resultClass : (clsList[0]||"");
  if(!cls) return [];
  return teacherSubjectsForClass(cls);
}
/* Result subject chips: the mapped subjects for the picked class
   FIRST (gold, data-mapped), then the rest of the standard list.
   Rebuilt in place by updateResultSubjectChips() when the class
   changes, so the typed form is never wiped. */
function resultSubjectChipsHtml(){
  var mapped = resultSubjectMappedForCurrentClass();
  var h = "";
  mapped.forEach(function(s){
    h += '<button type="button" class="btn ghost small" data-act="result-subject-add" data-subject="'+esc(s)+'" data-mapped="1" style="border-color:#c9a227;background:#fff8dc">'+esc(s)+"</button>";
  });
  RESULT_SUBJECTS.forEach(function(s){
    if(mapped.indexOf(s)>=0) return;
    h += '<button type="button" class="btn ghost small" data-act="result-subject-add" data-subject="'+esc(s)+'">'+esc(s)+"</button>";
  });
  return h;
}
function updateResultSubjectChips(){
  var row=document.getElementById("resultSubjectChips");
  if(row) row.innerHTML = resultSubjectChipsHtml();
}

    + '<div id="resultSubjectChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+resultSubjectChipsHtml()+"</div>";
  rows.forEach(function(r, i){

      + '<input type="text" data-input="result-subject" data-idx="'+i+'" data-field="subject" placeholder="বিষয়" value="'+esc(r.subject||"")+'" aria-label="বিষয়" style="flex:2;min-width:0" />'
      + '<input type="number" data-input="result-subject" data-idx="'+i+'" data-field="marks" placeholder="প্রাপ্ত" value="'+esc(r.marks==null?"":String(r.marks))+'" aria-label="প্রাপ্ত নম্বর" style="flex:1;min-width:0" />'
      + '<input type="number" data-input="result-subject" data-idx="'+i+'" data-field="total" placeholder="মোট" value="'+esc(r.total==null?"":String(r.total))+'" aria-label="মোট নম্বর" style="flex:1;min-width:0" />'
      + '<button type="button" class="mini-btn danger" data-act="result-subject-remove" data-idx="'+i+'" aria-label="বিষয় সরান">✕</button></div>';
  });
  h += '<button type="button" class="btn ghost small" data-act="result-subject-add">＋ বিষয় যোগ করুন</button>'
    + '<p class="dim small" id="resultSubjectSum" style="margin:8px 0 0">'+esc(resultSubjectSumLine())+"</p></div>";

/* Live sum while typing subjects: fills the মোট নম্বর fields in place
   (and locks them while subjects exist) — no re-render, no lost text. */
function updateResultSubjectSum(){
  var f=document.querySelector('form[data-form="result"]');
  if(!f) return;
  var rows=resultSubjectRows();
  var sumEl=document.getElementById("resultSubjectSum");
  if(sumEl) sumEl.textContent=resultSubjectSumLine();
  var mk=f.querySelector('input[name="marks"]'), tt=f.querySelector('input[name="total"]');
  if(mk && tt){
    if(rows.length){
      var s=resultSubjectSums(rows);
      mk.value=s.marks; tt.value=s.total; mk.readOnly=true; tt.readOnly=true;
      if(!ui.resultDraft) ui.resultDraft={};
      ui.resultDraft.marks=String(s.marks); ui.resultDraft.total=String(s.total);
    } else { mk.readOnly=false; tt.readOnly=false; }
  }
}
/* Copy whatever is currently typed in the homework/result form into
   its ui draft — called right before ANY render that would otherwise
   wipe the form (camera sheet open, subject row add/remove). The
   forms re-render from the draft, so the text comes back. */
function snapshotFormDrafts(){
  var hf=document.querySelector('form[data-form="homework"]');
  if(hf){
    if(!ui.hwDraft) ui.hwDraft={};
    var g=function(n){ var i=hf.querySelector('[name="'+n+'"]'); return i?i.value:""; };
    ui.hwDraft.className=g("className"); ui.hwDraft.subject=g("subject"); ui.hwDraft.text=g("text"); ui.hwDraft.dueDate=g("dueDate");
  }
  var rf=document.querySelector('form[data-form="result"]');
  if(rf){
    if(!ui.resultDraft) ui.resultDraft={};
    var g2=function(n){ var i=rf.querySelector('[name="'+n+'"]'); return i?i.value:""; };
    ui.resultDraft.studentId=g2("studentId"); ui.resultDraft.studentName=g2("studentName"); ui.resultDraft.roll=g2("roll"); ui.resultDraft.exam=g2("exam"); ui.resultDraft.marks=g2("marks"); ui.resultDraft.total=g2("total"); ui.resultDraft.grade=g2("grade");
  }
}
/* Teacher result form — ANY of the teacher's listed classes, and ANY
   subject (the form never blocks a subject). The class picker offers
   only the teacher's classes; the fields mirror the admin result
   form exactly, so the SAME submit branch handles both. */

    + '<form data-form="result">'
    + '<label class="f"><span>শ্রেণী</span><select name="resultClass" data-change="result-class" data-input="result-draft" data-field="resultClass" required aria-label="শ্রেণী">'+clsList.map(function(c){ return "<option"+(selCls===c?" selected":"")+">"+esc(c)+"</option>"; }).join("")+"</select></label>"

    + '<label class="f"><span>শিক্ষার্থীর নাম</span><input type="text" name="studentName" data-input="result-draft" data-field="studentName" value="'+esc(d.studentName||"")+'" placeholder="শিক্ষার্থীর নাম লিখুন" aria-label="শিক্ষার্থীর নাম" /></label>'
    + '<label class="f"><span>রোল নম্বর</span><input type="text" name="roll" inputmode="numeric" data-change="result-roll" data-input="result-draft" data-field="roll" value="'+esc(d.roll||"")+'" placeholder="যেমন: ৭" aria-label="রোল নম্বর" /></label>'
    + '<label class="f"><span>পরীক্ষার নাম</span><input type="text" name="exam" required data-input="result-draft" data-field="exam" value="'+esc(d.exam||"")+'" aria-label="পরীক্ষার নাম" /></label>'
    + resultSubjectSectionHtml()
    + '<label class="f"><span>প্রাপ্ত নম্বর</span><input type="number" name="marks" required data-input="result-draft" data-field="marks" value="'+esc(d.marks||"")+'"'+(hasSubs?" readonly":"")+' aria-label="প্রাপ্ত নম্বর" /></label>'
    + '<label class="f"><span>মোট নম্বর</span><input type="number" name="total" required data-input="result-draft" data-field="total" value="'+esc(d.total||"")+'"'+(hasSubs?" readonly":"")+' aria-label="মোট নম্বর" /></label>'
    + '<label class="f"><span>গ্রেড</span><select name="grade" required data-input="result-draft" data-field="grade" aria-label="গ্রেড">'+gradeOptions(d.grade||"")+"</select></label>"
    + '<div style="border:1px dashed #c9a227;border-radius:10px;padding:10px;margin:10px 0"><span class="dim small">ফাইল (ঐচ্ছিক) — ছবি (ক্যামেরা/গ্যালারি) বা PDF, সর্বোচ্চ ৩টি। গার্জিয়ানরা রেজাল্টের সাথে ফাইলটাও দেখতে পাবেন।</span>'

  var mine = (D.results||[]).filter(function(r){ return clsList.indexOf(r.className)>=0 && r.publishedBy===(ui.teacherName||"শিক্ষক"); }).slice(0,10);
  h += '<h3 style="margin:4px 0 10px">আপনার দেওয়া রেজাল্ট ('+bnNum(mine.length)+")</h3>";

  else h += mine.map(function(r){
    var st = findStudent(r.studentId);

    var rRoll = st ? st.roll : (r.roll||"");
    return '<div class="list-row"><div class="grow"><b>'+esc(rName)+(rRoll?' (রোল '+esc(bnNum(Number(rRoll)||rRoll))+')':"")+'</b>'

      + (r.attachments&&r.attachments.length?" • 📎 ফাইল আছে":"")+"</small></div></div>";
  }).join("");
  return h;
}

  else html += leaves.map(function(lv){
    var lvT = (D.teachers||[]).filter(function(x){ return x.id===lv.teacherId; })[0];
    /* A leave stores the teacher's classes as they were when it was
       requested; an old leave has only the single classTaken. */
    var lvCls = (lv.classes && lv.classes.length) ? lv.classes : (lvT ? teacherClassesOf(lvT) : (lv.classTaken ? [lv.classTaken] : []));
    var row = '<div class="person" style="cursor:default"><span><b>'+esc(lv.teacherName||"শিক্ষক")+'</b><small>ক্লাস: '+(lvCls.length?esc(lvCls.join(", ")):'দেওয়া হয়নি')+' • '+fmtDateBn(lv.fromDate)+' — '+fmtDateBn(lv.toDate)+' • '+esc(lv.reason||"")+'</small></span>'
      + '<span class="pill'+(lv.status==="approved"?" gold":lv.status==="rejected"?" urgent":"")+'">'+leaveStatusLabel(lv.status)+'</span></div>';
    if(isAdmin() && lv.status==="pending"){
      row += '<div class="row-btns" style="margin:-6px 0 10px"><button type="button" class="btn small" data-act="teacher-leave-approve" data-id="'+lv.id+'">অনুমোদন করুন</button>'
        + '<button type="button" class="btn ghost small" data-act="teacher-leave-reject" data-id="'+lv.id+'">বাতিল করুন</button>'
        + '<button type="button" class="mini-btn danger" data-act="ask-delete" data-kind="teacherleave" data-id="'+lv.id+'" data-label="এই আবেদনটি মুছে ফেলবেন?">মুছুন</button></div>';
    }
    return row;
  }).join("");
  return html;
}

function loginHtml(){
  // BUG FIX 2026-11-06: the admin login form must NEVER wait on the
  // private node. It used to return a "loading…" card while
  // fbPriv && !privLoaded, and nothing ever set privLoaded for a
  // logged-out visitor — the entry gate's Admin button never called
  // ensurePrivateLoaded() (only the old open-login path did) — so the
  // form never appeared. Now the private fetch runs in the
  // background and the LOGIN form shows immediately, using whatever
  // is known locally. Setup is offered only once the private node
  // has actually loaded and proved there are no admins — showing
  // setup before that could create a second primary admin on a
  // device where admins exist in Firebase but have not loaded yet.
  var privStillLoading = !!(fbPriv && !privLoaded);
  if(privStillLoading) ensurePrivateLoaded();
  var needsSetup = !privStillLoading && D.admins.length===0;
  var html = "";
  if(needsSetup){
    html += '<section class="card"><h2 class="sec-title">'+icon("lock")+' প্রধান অ্যাডমিন অ্যাকাউন্ট তৈরি করুন</h2>'
      + '<p class="dim small">প্রথমবার: প্রধান অ্যাডমিনের নাম, ফোন নম্বর, পাসওয়ার্ড আর একটি গোপন শব্দ (রিকভারি শব্দ) দিন। গোপন শব্দটা মনে রাখবেন — পাসওয়ার্ড ভুলে গেলে এটা দিয়েই রিসেট করা যাবে।</p>'
      + '<form data-form="setup">'

      + '<label class="f"><span>ফোন নম্বর</span><input type="tel" name="phone" required / aria-label="ফোন নম্বর" /></label>'
      + '<label class="f"><span>পাসওয়ার্ড</span><span class="pw-wrap"><input type="password" name="password" required / aria-label="পাসওয়ার্ড" /><button type="button" class="pw-eye" data-act="toggle-pw" aria-label="পাসওয়ার্ড দেখান/লুকান">'+icon("eye","sm")+"</button></span></label>"

      + '<button type="submit" class="btn wide">অ্যাকাউন্ট তৈরি করুন</button></form></section>';
  } else {
    html += '<section class="card"><h2 class="sec-title">'+icon("lock")+' অ্যাডমিন লগইন</h2>'
      + (privStillLoading ? '<p class="dim small" style="margin:0 0 10px">অ্যাডমিন তথ্য এখনো লোড হচ্ছে — তথ্য এলে পেজটি নিজে থেকে আপডেট হবে। লগইন করতে পারবেন; তথ্য না এলে একটু পর আবার চেষ্টা করুন।</p>' : '')
      + '<form data-form="login">'
      + '<label class="f"><span>ফোন নম্বর</span><input type="tel" name="phone" required / aria-label="ফোন নম্বর" /></label>'
      + '<label class="f"><span>পাসওয়ার্ড</span><span class="pw-wrap"><input type="password" name="password" required / aria-label="পাসওয়ার্ড" /><button type="button" class="pw-eye" data-act="toggle-pw" aria-label="পাসওয়ার্ড দেখান/লুকান">'+icon("eye","sm")+"</button></span></label>"
      + '<button type="submit" class="btn wide">লগইন করুন</button></form>'
      + '<p style="text-align:center;margin:12px 0 0"><button type="button" class="mini-btn" data-act="show-forgot">পাসওয়ার্ড ভুলে গেছেন?</button></p></section>';
    html += '<section class="card" id="forgotCard" hidden><h2 class="sec-title">'+icon("refresh")+' পাসওয়ার্ড রিসেট</h2>'

/* Teacher profile per-class subject editor (Admin → শিক্ষক): the
   admin TICKS every class the teacher takes (one checkbox per
   class in D.classes), and for EACH ticked class a subject row
   appears below — the standard subject checkboxes scoped to THAT
   class, so the profile records WHICH subject in WHICH class
   (ওয়ান: বাংলা, টু: অঙ্ক). A tick lands straight in the ui state
   — no full re-render, so the typed name/phone in the form is
   never wiped. Custom subjects (not in the standard list) are
   added from the class's free-text field and shown as removable
   chips in that class's row. The edit state lives in ui
   (teacherClassesEdit + teacherClassSubjectsEdit) and is
   (re)initialised when the edited teacher changes
   (ui.teacherEditFor), so already-ticked values stay ticked when
   the form is re-opened for editing. */
function teacherClassCustomSubjectsHtml(idx){
  var cls = (ui.teacherClassesEdit||[])[idx];
  var list = (cls && ui.teacherClassSubjectsEdit) ? (ui.teacherClassSubjectsEdit[cls]||[]) : [];
  var custom = list.filter(function(s){ return RESULT_SUBJECTS.indexOf(s)<0; });
  if(!custom.length) return "";
  return custom.map(function(s){
    var i = list.indexOf(s);
    return '<span class="pill gold" style="display:inline-flex;align-items:center;gap:4px">'+esc(s)+' <button type="button" data-act="teacher-class-subject-remove" data-class="'+esc(cls)+'" data-idx="'+i+'" style="border:0;background:none;cursor:pointer;padding:0" aria-label="বিষয় সরান">✕</button></span>';
  }).join("");
}
function updateTeacherClassCustomSubjects(idx){
  var row=document.getElementById("teacherClassCustomSubjects-"+idx);
  if(row) row.innerHTML = teacherClassCustomSubjectsHtml(idx);
}
/* Tick (or untick) a standard subject's checkbox in place in ONE
   class's row — used when the admin types a standard subject in
   that class's free-text field. */
function setTeacherClassSubjectCheckbox(cls, name, on){
  var cbs=document.querySelectorAll('input[data-change="teacher-class-subject-check"]');
  for(var i=0;i<cbs.length;i++){ if(cbs[i].value===name && cbs[i].getAttribute("data-class")===cls) cbs[i].checked=!!on; }
}
/* One subject row per ticked class. Rebuilt in place by
   updateTeacherClassSubjectRows() on a class tick/untick. */

        }).join("")

}

function studentOptions(selId){
  return D.students.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+">"+esc(x.name)+" — শ্রেণী: "+esc(x.className||"")+" (রোল "+esc(bnNum(Number(x.roll)||x.roll))+")</option>"; }).join("");
}
/* Result form's student picker: students grouped under their class
   (শিশু, ওয়ান, টু, থ্রি, নাজেরা, হেফজ বিভাগ — whatever classes exist
   in D.classes, in that order), and every option also carries the
   class name next to the student's name, so the class is visible both
   in the group heading and on each student's own line. */
function studentOptionsGrouped(selId){
  var used = {}, groups = [];
  D.classes.forEach(function(c){ groups.push(c); });
  D.students.forEach(function(x){ if(x.className && groups.indexOf(x.className)<0) groups.push(x.className); });
  var html = "";
  groups.forEach(function(c){
    var members = D.students.filter(function(x){ return (x.className||"")===c; });
    if(!members.length) return;
    used[c] = true;
    html += '<optgroup label="'+esc(c)+'">'
      + members.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+">"+esc(x.name)+" — শ্রেণী: "+esc(x.className||"")+" (রোল "+esc(bnNum(Number(x.roll)||x.roll))+")</option>"; }).join("")
      + "</optgroup>";
  });
  var rest = D.students.filter(function(x){ return !x.className; });
  if(rest.length){
    html += rest.map(function(x){ return '<option value="'+x.id+'"'+(selId===x.id?" selected":"")+">"+esc(x.name)+"</option>"; }).join("");
  }
  return html;
}
/* Fee form's month picker: every month from জানুয়ারি to ডিসেম্বর,
   built from the current date — the current year plus the two years
   after it — so when a year ends, the next year's months (যেমন ২০২৭)
   are already in the list with nothing for the admin to add. The
   stored value is the label itself ("নভেম্বর ২০২৬"), exactly what the
   fee lists already print. The current month starts selected. */
var FEE_MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function feeMonthOptions(){
  var now = new Date(), curY = now.getFullYear(), curM = now.getMonth();
  var html = "";
  for(var y = curY; y <= curY + 2; y++){
    html += '<optgroup label="'+esc(bnNum(y))+' সাল">'
      + FEE_MONTHS_BN.map(function(m, i){
          var label = m + " " + bnNum(y);
          return '<option value="'+esc(label)+'"'+(y===curY && i===curM ? " selected" : "")+">"+esc(label)+"</option>";
        }).join("")
      + "</optgroup>";
  }
  return html;
}

var GRADE_OPTIONS = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "D", "F"];
function classOptions(sel){

/* Fee/result forms: the picked student's name + roll, unmissable.
   studentInfoHtml(st) renders the line shown under the student dropdown
   ("শিক্ষার্থী: <name> • রোল: <roll> • শ্রেণী: <class>"); the update
   helpers refresh it in place on every student/class change so typed
   exam/marks/amount are never lost to a full re-render. */
function studentInfoHtml(st){
  if(!st) return '<div class="student-info dim small" style="margin:2px 0 8px">শিক্ষার্থী বাছলে এখানে নাম ও রোল নম্বর দেখাবে।</div>';
  return '<div class="student-info" style="margin:2px 0 8px;padding:8px 10px;border-radius:10px;background:var(--card2,#eef6ff);font-weight:600">শিক্ষার্থী: '+esc(st.name)+' • রোল: '+esc(bnNum(Number(st.roll)||st.roll))+' • শ্রেণী: '+esc(st.className||"")+'</div>';
}
function normRoll(s){ return String(s||"").replace(/[\u09E6-\u09EF]/g, function(d){ return "\u09E6\u09E7\u09E8\u09E9\u09EA\u09EB\u09EC\u09ED\u09EE\u09EF".indexOf(d); }).replace(/\s+/g,"").trim(); }
function fillStudentFields(form, st){
  var f = document.querySelector('form[data-form="'+form+'"]'); if(!f) return;
  var nm = f.querySelector('input[name="studentName"]'), rl = f.querySelector('input[name="roll"]');
  if(nm) nm.value = st ? st.name : "";
  if(rl) rl.value = st ? String(st.roll||"") : "";
}
function updateStudentInfo(form, id){
  var st = findStudent(id);
  fillStudentFields(form, st);
  var box = document.querySelector('form[data-form="'+form+'"] .student-info');
  if(box) box.outerHTML = studentInfoHtml(st);
}
function fillStudentByRoll(form){
  var f = document.querySelector('form[data-form="'+form+'"]'); if(!f) return;
  var rl = f.querySelector('input[name="roll"]'); if(!rl) return;
  var r = normRoll(rl.value); if(!r) return;
  var cls = form==="fee" ? ui.feeClass : ui.resultClass;
  /* The result form's own class picker (admin: all classes; teacher:
     their classes) is the truth — read it from the form itself. */
  if(form==="result"){ var _cs = f.querySelector('select[name="resultClass"]'); if(_cs && _cs.value) cls = _cs.value; }
  var st = D.students.filter(function(x){ return (x.className||"")===cls && normRoll(x.roll)===r; })[0] || null;
  if(st){
    var nm = f.querySelector('input[name="studentName"]'); if(nm) nm.value = st.name;
    var sel = f.querySelector('select[name="studentId"]'); if(sel) sel.value = st.id;
    var box = f.querySelector('.student-info'); if(box) box.outerHTML = studentInfoHtml(st);
  }
}

function adminFeesHtml(){
