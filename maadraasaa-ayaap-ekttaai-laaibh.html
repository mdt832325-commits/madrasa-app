    + '<form data-form="fee">'
    + '<label class="f"><span>শ্রেণী</span><select name="feeClass" data-change="fee-class" required aria-label="শ্রেণী">'+classOptions(ui.feeClass)+"</select></label>"
    + '<label class="f"><span>শিক্ষার্থী</span><select name="studentId" data-change="fee-student" aria-label="শিক্ষার্থী">'+studentsOfClassOptions(ui.feeClass, "")+"</select></label>"
    + '<label class="f"><span>শিক্ষার্থীর নাম</span><input type="text" name="studentName" placeholder="শিক্ষার্থীর নাম লিখুন" aria-label="শিক্ষার্থীর নাম" /></label>'
    + '<label class="f"><span>রোল নম্বর</span><input type="text" name="roll" inputmode="numeric" data-change="fee-roll" placeholder="যেমন: ৭" aria-label="রোল নম্বর" /></label>'
    + '<label class="f"><span>কোন মাসের ফি</span><select name="month" required aria-label="কোন মাসের ফি">'+feeMonthOptions()+"</select></label>"
    + '<label class="f"><span>টাকার পরিমাণ (৳)</span><input type="number" name="amount" required / aria-label="টাকার পরিমাণ" /></label>'
    + '<label class="f"><span>অবস্থা</span><select name="status" aria-label="অবস্থা"><option value="paid">পরিশোধিত</option><option value="partial">আংশিক পরিশোধিত</option><option value="due">বকেয়া</option></select></label>'
    + '<button type="submit" class="btn wide">ফি সংরক্ষণ করুন</button></form></section>';
  html += '<h3 style="margin:4px 0 10px">সাম্প্রতিক ফি-এর হিসাব</h3>';
  if(!D.fees.length) html += '<div class="card empty">কোনো ফি-এর হিসাব নেই।</div>';
  html += D.fees.slice(0,20).map(function(f){
    var st = findStudent(f.studentId);
    var fName = st ? st.name : (f.studentName||"(নাম দেওয়া হয়নি)");
    var fRoll = st ? st.roll : (f.roll||"");
    var fClass = st ? st.className : (f.className||"");
    return '<div class="list-row"><div class="grow"><b>'+esc(fName)+(fRoll?' (রোল '+esc(bnNum(Number(fRoll)||fRoll))+')':"")+'</b>'+(fClass?' <span class="pill gold">শ্রেণী: '+esc(fClass)+'</span>':"")+'<small>মাস: <b>'+esc(f.month)+'</b> • শ্রেণী: '+esc(fClass||"—")+'</small><small>'+fmtMoney(f.amount)+" • "+feeLabel(f.status)+'</small></div>'
      + '<button type="button" class="mini-btn danger" data-act="ask-delete" data-kind="fee" data-id="'+f.id+'" data-label="এই ফি-এর হিসাবটি মুছে ফেলবেন?">মুছুন</button></div>';
  }).join("");
  return html;
}

function adminAdminsHtml(){
  var me = currentAdmin();
  var html = '<section class="card"><h2 class="sec-title">'+icon("users")+' অ্যাডমিনগণ ('+bnNum(D.admins.length)+"/৩)</h2>";
  html += D.admins.map(function(a){
    var isMe = a.phone===sessionPhone;
    return '<div class="list-row"><div class="grow"><b>'+esc(a.name)+(isMe?" (আপনি)":"")+'</b><small>'+esc(a.phone)+" • "+(a.isPrimary?"প্রধান অ্যাডমিন":"সহ-অ্যাডমিন")+(a.active===false?" • নিষ্ক্রিয়":"")+'</small></div>'
      + (me.isPrimary && !a.isPrimary ? '<button type="button" class="mini-btn" data-act="admin-reset-pw" data-phone="'+esc(a.phone)+'">পাসওয়ার্ড রিসেট</button>'
        + '<button type="button" class="mini-btn" data-act="admin-toggle" data-phone="'+esc(a.phone)+'">'+(a.active===false?"সক্রিয় করুন":"নিষ্ক্রিয় করুন")+"</button>"
        + '<button type="button" class="mini-btn" data-act="admin-promote" data-phone="'+esc(a.phone)+'">প্রধান করুন</button>'
        + '<button type="button" class="mini-btn danger" data-act="ask-delete" data-kind="admin" data-id="'+esc(a.phone)+'" data-label="এই সহ-অ্যাডমিনকে সরিয়ে দেবেন?">সরান</button>' : "")
      + "</div>";
  }).join("");
  if(D.admins.length < 3){
    html += '<h3 style="margin:16px 0 6px">নতুন সহ-অ্যাডমিন যোগ করুন</h3>'
      + '<form data-form="add-admin">'
      + '<label class="f"><span>নাম</span><input type="text" name="name" required / aria-label="নাম" /></label>'
      + '<label class="f"><span>ফোন নম্বর</span><input type="tel" name="phone" required / aria-label="ফোন নম্বর" /></label>'
      + '<label class="f"><span>পাসওয়ার্ড</span><span class="pw-wrap"><input type="password" name="password" required / aria-label="পাসওয়ার্ড" /><button type="button" class="pw-eye" data-act="toggle-pw" aria-label="পাসওয়ার্ড দেখান/লুকান">'+icon("eye","sm")+"</button></span></label>"
      + '<label class="f"><span>গোপন শব্দ (তার রিকভারির জন্য)</span><input type="text" name="secret" required / aria-label="গোপন শব্দ" /></label>'
      + '<button type="submit" class="btn wide">সহ-অ্যাডমিন যোগ করুন</button></form>';
  }
  html += '<h3 style="margin:18px 0 6px">আমার পাসওয়ার্ড বদলান — '+esc(me.name)+'</h3>'
    + '<form data-form="change-pw">'
    + '<label class="f"><span>বর্তমান পাসওয়ার্ড</span><span class="pw-wrap"><input type="password" name="current" required / aria-label="বর্তমান পাসওয়ার্ড" /><button type="button" class="pw-eye" data-act="toggle-pw" aria-label="পাসওয়ার্ড দেখান/লুকান">'+icon("eye","sm")+"</button></span></label>"
    + '<label class="f"><span>নতুন পাসওয়ার্ড</span><span class="pw-wrap"><input type="password" name="password" required / aria-label="পাসওয়ার্ড" /><button type="button" class="pw-eye" data-act="toggle-pw" aria-label="পাসওয়ার্ড দেখান/লুকান">'+icon("eye","sm")+"</button></span></label>"
    + '<label class="f"><span>নতুন গোপন শব্দ (ঐচ্ছিক — খালি রাখলে আগেরটাই থাকবে)</span><input type="text" name="secret" / aria-label="গোপন শব্দ" /></label>'
    + '<button type="submit" class="btn wide">পাসওয়ার্ড বদলান</button></form></section>';
  return html;
}

/* ---------------- after render: QR ---------------- */
function afterRender(){
  /* Group meeting (Jitsi, v1.0.18): mount the meeting once its
     container is in the DOM. If the meeting was ended from another
     device while this one was in it, close the view (one extra
     render; the second pass then finds meetingView null and stops). */
  if(ui.meetingView){
    var mm = meetingByRoom(ui.meetingView);
    if(!mm || mm.status !== "live"){ closeMeetingView(); render(); return; }
    mountJitsi();
  }
  /* Internet call: the remote audio element is rebuilt with every
     render (it lives in the call overlay), so re-attach the live
     remote stream after each one — otherwise the voice goes silent
     after the next re-render. */
  callAttachRemoteAudio();
  if(ui.tab==="complaints") fetchOwnComplaintReplies();
  if(ui.sheet==="camera"){
    /* A sync re-render rebuilds #app and destroys the <video> element;
       re-attach the live stream (or start it) so the preview survives. */
    var v=document.getElementById("cameraVideo");
    if(v){
      if(cameraStream) attachCameraVideo();
      else if(!cameraStarting) startCameraStream();
    }
  }
  if(ui.sheet==="share"){
    var box = document.getElementById("qrBox");
    var link = effectiveShareLink();
    if(box && link){
      var m = makeQrMatrix(link);
      if(m) box.innerHTML = qrToSvg(m, 6) + '<p class="dim small" style="margin:8px 0 0;text-align:center">ক্যামেরা দিয়ে স্ক্যান করলেই অ্যাপ খুলবে</p>';
      else box.innerHTML = '<p class="dim small">লিংকটা অনেক লম্বা, QR বানানো যায়নি।</p>';
    }
  }
}

/* ================================================================
   EVENTS
   ================================================================ */
var logoTaps = { count:0, firstAt:0 };

/* Track whether a finger/mouse is currently down. Background sync uses
   this to hold its re-renders until the tap completes (see
   renderFromSync), so a sync event can never swallow a tap. Capture
   phase, passive, and it never touches the event itself — taps,
   scrolling and the three-dot menu all behave exactly as before. */
document.addEventListener("pointerdown", function(){ pointerDown = true; }, { capture:true, passive:true });
document.addEventListener("pointerup", function(){ pointerDown = false; flushSyncRender(); }, { capture:true, passive:true });
document.addEventListener("pointercancel", function(){ pointerDown = false; flushSyncRender(); }, { capture:true, passive:true });
/* Typing hold (see isTextFieldEl / renderFromSync): while the user is in
   a text field, background sync renders are held; when the field is
   left, the pending render runs. The setTimeout lets a focus move
   straight to another text field re-arm the guard first, so no render
   ever lands between two fields. */
document.addEventListener("focusin", function(e){ if(isTextFieldEl(e.target)) typingActive = true; }, { capture:true, passive:true });
document.addEventListener("focusout", function(e){
  if(!isTextFieldEl(e.target)) return;
  typingActive = false;
  setTimeout(function(){ if(!typingActive && !pointerDown) flushSyncRender(); }, 0);
}, { capture:true, passive:true });

document.addEventListener("click", function(e){
  /* Salam + Durud: the first tap inside the app plays the greeting
     once per session (browsers only allow audio after a user tap). */
  if(!salamPlayedThisSession) playSalamOnce();
  var el = e.target.closest("[data-act]");
  if(!el){
    if(ui.sheet && e.target.classList && e.target.classList.contains("sheet-scrim")){ stopCameraStream(); ui.sheet=null; ui.backupJson=""; ui.attachNoticeId=null; idcardRotDeg=0; idcardScanDataUrl=""; render(); }
    return;
  }
  var act = el.getAttribute("data-act");
  if(act==="sheet-scrim") return;
  if(act==="play-salam"){ if(!salamSoundOn()){ toast("সালাম ও দরুদ শোনা বন্ধ আছে — চালু করতে নিচের বোতামে চাপুন"); } else if(!salamIsPlaying()){ playSalamDurud(true); } }
  else if(act==="toggle-salam-sound"){
    var _salamOn = !salamSoundOn();
    setSalamSound(_salamOn);
    if(!_salamOn){ stopSalamAudio(); }
    ui.menuOpen=false; render();
    toast(_salamOn ? "সালাম ও দরুদ শোনা চালু আছে" : "সালাম ও দরুদ শোনা বন্ধ করা হয়েছে");
  }
  else if(act==="toggle-azan"){
    var _azanOn = !azanOn();
    setAzanOn(_azanOn);
    if(!_azanOn){ stopAzanNow(); }
    ui.menuOpen=false; render();
    toast(_azanOn ? "আজান চালু আছে — নামাজের সময় বাজবে" : "আজান বন্ধ করা হয়েছে");
  }
  else if(act==="play-azan-test"){ playAzanNow(true); azanRefreshStopBtn(); }
  else if(act==="stop-azan"){ stopAzanNow(); render(); toast("আজান বন্ধ করা হয়েছে"); }
  else if(act==="toggle-menu"){ ui.menuOpen=!ui.menuOpen; render(); }
  else if(act==="close-menu"){ ui.menuOpen=false; render(); }
  else if(act==="goto"){
    var wasMenuOpen = ui.menuOpen;
    ui.tab=el.getAttribute("data-tab"); ui.menuOpen=false; ui.studentDetailId=null; ui.myChildId=null;
    /* Live chat: leaving the বার্তা tab stops the guardian's
       15-second thread refresh. */
    if(ui.tab!=="guardianmsg") stopGuardianChatPoll();
    // From the tab bar this takes the fast path — the switch happens in
    // this same tap, never waiting on a full-page rebuild or on sync.
    if(wasMenuOpen) render(); else renderTabSwitch();
    window.scrollTo(0,0);
  }
  else if(act==="goto-admin"){ ui.tab="admin"; ui.menuOpen=false; render(); }
  else if(act==="open-login"){ ui.adminRevealed=true; ui.tab="admin"; ui.menuOpen=false; ensurePrivateLoaded(); render(); window.scrollTo(0,0); }
  else if(act==="logo-tap"){
    var now=Date.now();
    if(now-logoTaps.firstAt>2500){ logoTaps={count:1,firstAt:now}; }
    else { logoTaps.count++; if(logoTaps.count>=5){ logoTaps={count:0,firstAt:0}; ui.adminRevealed=true; ui.tab="admin"; ensurePrivateLoaded(); render(); } }
  }
  else if(act==="refresh"){
    /* A second tap while a refresh is already running does nothing —
       the button is disabled and spinning, so the app can never stack
       several slow Firebase fetches on top of each other. */
    if(refreshing) return;
    ui.menuOpen=false;
    startRefreshSpin();
    /* finishRefresh(false) is already armed on a 5-second timer inside
       startRefreshSpin(), so a slow/stuck Firebase can never leave the
       spinner on or the app looking frozen. */
    if(restMode){
      restFetchPublic(true).then(function(){ finishRefresh(syncStatus==="live"); }).catch(function(){ finishRefresh(false); });
    }

function fileToDataUrl(file, maxW){
  return new Promise(function(resolve, reject){
    var done=false;
    function ok(v){ if(!done){ done=true; resolve(v); } }
    function bad(e){ if(!done){ done=true; reject(e||new Error("img")); } }
    var url;
    try{ url=URL.createObjectURL(file); }catch(e){ bad(e); return; }
    var timer=setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} bad(new Error("timeout")); }, 15000);
    var img=new Image();
    img.onload=function(){
      clearTimeout(timer);
      try{
        URL.revokeObjectURL(url);
        if(!img.width || !img.height){ bad(new Error("size")); return; }
        maxW=maxW||800; var scale=img.width>maxW?maxW/img.width:1;
        var cv=document.createElement("canvas");
        cv.width=Math.max(1, Math.round(img.width*scale)); cv.height=Math.max(1, Math.round(img.height*scale));
        var cx=cv.getContext("2d"); if(!cx){ bad(new Error("canvas")); return; }
        cx.drawImage(img,0,0,cv.width,cv.height);
        ok(cv.toDataURL("image/jpeg",0.8));
      }catch(e){ bad(e); }
    };
    img.onerror=function(){ clearTimeout(timer); try{ URL.revokeObjectURL(url); }catch(e){} bad(new Error("img")); };
    img.src=url;
  });
}

/* FileReader fallback for photo picking: if the canvas decode in
   fileToDataUrl fails (unusual format, huge image, canvas OOM), the
   raw file bytes are still usable as a data URL — used uncompressed.
   Only used when fileToDataUrl rejects, never for the first try. */
function readFileAsDataUrl(file){
  return new Promise(function(resolve, reject){
    var done=false;
    var timer=setTimeout(function(){ if(!done){ done=true; reject(new Error("timeout")); } }, 15000);
    var rd=new FileReader();
    rd.onload=function(){ if(!done){ done=true; clearTimeout(timer); resolve(rd.result); } };
    rd.onerror=function(){ if(!done){ done=true; clearTimeout(timer); reject(new Error("read")); } };
    try{ rd.readAsDataURL(file); }catch(e){ if(!done){ done=true; clearTimeout(timer); reject(e); } }
  });
}

/* ---- Photo picking (robust) ----
   WHY this exists: the old picker was a hidden <input type="file"> rendered
   INSIDE #app. Every render() rebuilds #app, so a Firebase sync snapshot
   arriving while the user was picking a photo destroyed the input element
   and the change event never reached the app (silent failure). And after a
   pick, the old code called full render(), wiping everything the admin had
   already typed in the form. Fix: ONE persistent file input, created once
   and kept OUTSIDE #app (appended to <body>), with its own direct change
   listener. Picking updates only the preview image in place - the form and
   its typed values are never rebuilt.
   NOTE for the APK: a plain Android WebView also needs a WebChromeClient
   with onShowFileChooser, or tapping any file input does nothing at all.
   That lives in the APK's MainActivity.java, not in this HTML file. */
/* Off-screen (NOT display:none) picker inputs: a programmatic
   .click() on a display:none <input type="file"> opens nothing in
   some Android WebViews, so every picker input lives off-screen
   instead — reachable by the browser, invisible to the user. */
function hidePickerInput(inp){
  inp.style.position="fixed"; inp.style.left="-9999px"; inp.style.top="0";
  inp.style.width="1px"; inp.style.height="1px"; inp.style.opacity="0";
  inp.style.pointerEvents="none";
}
var photoInput=null, pendingPhotoKind="";
function ensurePhotoInput(){
  if(photoInput) return photoInput;
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; hidePickerInput(inp);
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0];
    if(f) handlePhotoFile(f);
    try{ inp.value=""; }catch(e){}
  });
  document.body.appendChild(inp);
  photoInput=inp;
  return inp;
}
/* ---- Camera capture (in-app, v1.0.5+) ----
   The old capture file input is kept only as an unused fallback:
   Android WebView does not honour the capture attribute, so in
   APK v1.0.4 it fell through to the gallery chooser. The real
   camera now lives in cameraSheetHtml() — a live getUserMedia
   preview inside the app. */
var cameraInput=null;
function ensureCameraInput(){
  if(cameraInput) return cameraInput;
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.setAttribute("capture","environment"); hidePickerInput(inp);
  inp.addEventListener("change", function(){
    var f=inp.files && inp.files[0];
    if(f) handlePhotoFile(f);
    try{ inp.value=""; }catch(e){}
  });
  document.body.appendChild(inp);
  cameraInput=inp;
  return inp;
}
/* Shared success path for a picked photo — canvas-compressed

   store it in the right pending field, update the in-place preview,

  if(kind==="result"){

      var jm=joined.match(/^01[3-9][0-9]{8}/) || joined.match(/^01[3-9][0-9]{7}/) || joined.match(/^01[3-9][0-9]{6}/);
      if(jm) out.phone=jm[0];
    }
  }

  for(i=0;i<nlines.length && !out.roll;i++){
    var li=nlines[i];

      m=li.match(/(\d{1,3})(?!\d)/);
      if(m && Number(m[1])>0) out.roll=String(Number(m[1]));
      else if(i+1<nlines.length){ var nx=nlines[i+1].match(/^(\d{1,3})$/); if(nx && Number(nx[1])>0) out.roll=String(Number(nx[1])); }
    }
  }
  /* --- ID number: any digit run near the আইডি / ID label (kept separate from roll) --- */

      var mid=liId.replace(/^.*?(আইডি|ID)\s*(নম্বর|নং|No\.?|Number)?\s*[:ঃ\-]?\s*/i,"");

      if(mm){ var idv=mm[1].replace(/[^0-9]/g,""); if(idv) out.idNumber=idv; }

      valM=valM.replace(/^ছবি\s*[:ঃ]?\s*/,"");
      if(!valM && i+1<lines.length){
        var nxM=lines[i+1];
        if(!/রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|পিতা|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|roll|class|phone|mobile|section/i.test(nxM)) valM=nxM;
      }

      var after=li2.replace(/^.*?(শ্রেণী|শ্রেনী|শ্রেণি|ক্লাস|জামাত|class)\s*[:ঃ\-]?\s*/i,"");

        var nx2=lines[i+1];
        if(!/রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|পিতা|মাতা|ঠিকানা|জন্ম|roll|class|phone|mobile/i.test(nx2)) val=nx2;

  if(out.name && out.motherName && idcardSameName(out.name, out.motherName)) out.name="";
  if(out.name && out.fatherName && idcardStartsWithName(out.name, out.fatherName)) out.name="";
  if(out.name && out.motherName && idcardStartsWithName(out.name, out.motherName)) out.name="";

     Use Tesseract's word boxes: the tallest bare Bengali name line

  /* --- name in big green letters below the photo: the green-crop

     mother's name. */
  if(!out.name && greenName){
    var gn=idcardFixMoPrefix(idcardCleanName(greenName));
    if(gn){
      var isParent=(out.fatherName && (idcardSameName(gn, out.fatherName) || idcardStartsWithName(gn, out.fatherName)))

    out.name=idcardBigName(words, lines, [out.fatherName, out.motherName]);
  }
  /* --- father's name WITHOUT a readable label: on a noisy card the
     "পিতার নাম" label itself can be misread as Latin ("Pema"), so
     the label search finds nothing. Fall back to a line that is a
     bare মোঃ name (3-4 Bengali words, no label/madrasa words) and
     is not the student's own name. */
  if(!out.fatherName){
    for(i=0;i<lines.length && !out.fatherName;i++){
      var liFx=lines[i];
      if(!/মোঃ/.test(liFx)) continue; /* the line must really carry মোঃ — fixMoPrefix must never invent it for a garbage line */
      if(/পিতার|মাতার|নাম|রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|মাদ্রাসা|মাদরাসা|ইন্টারন্যাশনাল|পরিচয়পত্র|মোহতামিম|ছবি/i.test(liFx)) continue;
      /* the label itself may be misread as Latin ("Pema: মোঃ ...") —
         drop everything up to the first colon, the name follows it */
      var liFx2=liFx.replace(/^[^:]*:\s*/,"");
      var cand=idcardFixMoPrefix(idcardCleanName(liFx2));
      if(cand && /^মোঃ\s/.test(cand) && !idcardSameName(cand, out.name)){
        var cwFx=cand.split(/\s+/);
        if(cwFx.length>=3 && cwFx.length<=4) out.fatherName=cand;
      }
    }
  }
  return out;
}

function downscaleImage(dataUrl, maxW){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        if(!img.width || img.width<=maxW){ resolve(dataUrl); return; }
        var scale=maxW/img.width;
        var cv=document.createElement("canvas");
        cv.width=maxW; cv.height=Math.max(1, Math.round(img.height*scale));
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL("image/jpeg",0.85));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}
/* Grayscale + contrast boost before OCR: phone photos of cards are
   often low-contrast, and Tesseract reads black-on-white text far
   better than a colour photo. Any failure falls back to the
   original image, so this can never break a scan. */
function preprocessForOcr(dataUrl){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");
        cv.width=img.width; cv.height=img.height;
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.drawImage(img,0,0);
        var d=cx.getImageData(0,0,cv.width,cv.height), px=d.data;
        for(var i=0;i<px.length;i+=4){
          var g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
          var v=(g-128)*1.5+128;
          if(v<0) v=0; if(v>255) v=255;
          px[i]=v; px[i+1]=v; px[i+2]=v;
        }
        cx.putImageData(d,0,0);
        resolve(cv.toDataURL("image/jpeg",0.9));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}
/* A green-crop OCR line is the student's name when it is 2-4
   Bengali words, no digits, no labels. Each line of the crop text
   is tried; the first name-like line wins. */
function idcardGreenNameClean(t){
  var lines=String(t||"").split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var s=idcardFixMoPrefix(idcardCleanName(lines[i]));
    if(!s) continue;
    if(!/[̀-῿]/.test(s)) continue;
    if(/[0-9০-৯]/.test(lines[i])) continue;
    if(/নাম|পিতা|মাতা|রোল|শ্রেণী|শ্রেনী|ক্লাস|ফোন|মোবাইল|ঠিকানা|জন্ম|বিভাগ|শাখা|আইডি|মাদ্রাসা|মোহতামিম|ছবি/i.test(s)) continue;
    var w=s.split(/\s+/);
    if(w.length>=2 && w.length<=4) return s;
  }

/* Find the green student name: locate the biggest green-text band
   (the big name below the photo), crop it, grayscale+contrast it,
   and OCR just that line. Returns the cleaned name or "". It never
   throws — any failure returns "" so the normal scan path is
   unaffected. The header is also green, but it is a solid panel
   (filtered by fill) and its text is yellow, so the band finder
   picks the name, not the header. */
function idcardGreenName(dataUrl){
  return new Promise(function(resolve){
    try{
      if(typeof Tesseract==="undefined"){ resolve(""); return; }
      var img=new Image();
      img.onload=function(){
        try{
          var cv=document.createElement("canvas");
          cv.width=img.width; cv.height=img.height;
          var cx=cv.getContext("2d");
          if(!cx){ resolve(""); return; }
          cx.drawImage(img,0,0);
          var d=cx.getImageData(0,0,cv.width,cv.height);
          var band=idcardGreenBand(d.data, cv.width, cv.height);
          if(!band){ resolve(""); return; }
          var bw=band.x1-band.x0+1, bh=band.y1-band.y0+1;
          var x0=Math.max(0, band.x0-Math.round(bw*0.25));
          var x1=Math.min(cv.width-1, band.x1+Math.round(bw*0.25));
          var y0=Math.max(0, band.y0-Math.round(bh*0.5));
          var y1=Math.min(cv.height-1, band.y1+Math.round(bh*0.5));
          var cw2=document.createElement("canvas");
          cw2.width=x1-x0+1; cw2.height=y1-y0+1;
          var cx2=cw2.getContext("2d");
          if(!cx2){ resolve(""); return; }
          cx2.drawImage(cv, x0, y0, cw2.width, cw2.height, 0, 0, cw2.width, cw2.height);
          var d2=cx2.getImageData(0,0,cw2.width,cw2.height), p2=d2.data;
          for(var i=0;i<p2.length;i+=4){
            var g2=0.299*p2[i]+0.587*p2[i+1]+0.114*p2[i+2];
            var v=(g2-128)*1.5+128; if(v<0)v=0; if(v>255)v=255;
            p2[i]=v; p2[i+1]=v; p2[i+2]=v;
          }
          cx2.putImageData(d2,0,0);
          var url=cw2.toDataURL("image/jpeg",0.9);
          Tesseract.recognize(url, "ben+eng", { tessedit_pageseg_mode:"7" }).then(function(res){
            var nm=idcardGreenNameClean((res && res.data && res.data.text)||"");
            if(nm) return nm;
            return Tesseract.recognize(url, "ben+eng", { tessedit_pageseg_mode:"6" }).then(function(res2){
              return idcardGreenNameClean((res2 && res2.data && res2.data.text)||"");
            });
          }).then(function(nm){ resolve(nm||""); }).catch(function(){ resolve(""); });
        }catch(e){ resolve(""); }
      };
      img.onerror=function(){ resolve(""); };
      img.src=dataUrl;
    }catch(e){ resolve(""); }
  });
}
/* Tesseract (ID-card OCR) is admin-only and used rarely, so it is NOT
   loaded at boot — the old static <script> tag cost every guardian a
   large library download and parse on every app open. It is fetched on
   demand the first time a scan actually runs, then cached for the
   session. A failed load rejects so the next scan can retry. */
var TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
var tesseractPromise = null;
function ensureTesseract(){
  if(typeof Tesseract !== "undefined") return Promise.resolve();
  if(tesseractPromise) return tesseractPromise;
  tesseractPromise = new Promise(function(resolve, reject){
    var done = false;
    function ok(){
      if(done) return; done = true;
      if(typeof Tesseract !== "undefined") resolve();
      else { tesseractPromise = null; reject(new Error("tesseract missing")); }
    }
    function bad(){
      if(done) return; done = true;
      tesseractPromise = null; reject(new Error("tesseract load failed"));
    }
    var s = document.createElement("script");
    s.src = TESSERACT_URL;
    s.onload = ok;
    s.onerror = bad;
    try{ document.head.appendChild(s); }catch(e){ bad(); return; }
    /* Hard timeout: a stalled CDN must not hang the scan forever. */
    setTimeout(function(){ if(!done) bad(); }, 30000);
  });
  return tesseractPromise;
}
function runIdCardOcr(dataUrl){

/* ---------------- ID-card rotate preview ----------------
   The card is often photographed sideways (text running
   vertically), and Tesseract reads sideways text as garbage —
   that was the main reason real scans failed. So after the photo
   is taken/picked, a preview sheet lets the admin rotate the
   image 90° per tap until the text reads straight, then tap
   "পড়ুন" to run OCR on the shown orientation. OCR is NOT run
   four times automatically (too slow on a phone). */
var idcardScanDataUrl="", idcardRotDeg=0;
function openIdCardRotateSheet(dataUrl){
  idcardScanDataUrl=dataUrl; idcardRotDeg=0;
  ui.sheet="idcard-rotate"; render();
}
function idcardRotateSheetHtml(){
  var deg=idcardRotDeg;
  var body='<div class="sheet-scrim" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-label="আইডি কার্ড সোজা করুন">'
    + '<h2>🪪 আইডি কার্ড সোজা করুন<button type="button" class="close-x" data-act="idcard-cancel" aria-label="বন্ধ করুন">✕</button></h2>'
    + '<p class="dim small">লেখা সোজা করে পড়তে না পারলে ↻ ঘুরান চাপুন — লেখা সোজা হলে 🔍 পড়ুন চাপুন।</p>'

/* Rotate the image data itself (not just the preview) so OCR sees
   the upright card. */
function rotateImageDataUrl(dataUrl, deg){
  return new Promise(function(resolve){
    if(!deg){ resolve(dataUrl); return; }
    var img=new Image();
    img.onload=function(){
      try{
        var cv=document.createElement("canvas");
        var rad=deg*Math.PI/180;
        if(deg===90 || deg===270){ cv.width=img.height; cv.height=img.width; }
        else { cv.width=img.width; cv.height=img.height; }
        var cx=cv.getContext("2d");
        if(!cx){ resolve(dataUrl); return; }
        cx.translate(cv.width/2, cv.height/2);
        cx.rotate(rad);
        cx.drawImage(img, -img.width/2, -img.height/2);
        resolve(cv.toDataURL("image/jpeg",0.9));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror=function(){ resolve(dataUrl); };
    img.src=dataUrl;
  });
}

function fileToDocDataUrl(file){
  return new Promise(function(resolve, reject){
    var done=false, timer=setTimeout(function(){ if(!done){ done=true; reject(new Error("timeout")); } }, 15000);
    var rd=new FileReader();
    rd.onload=function(){ if(!done){ done=true; clearTimeout(timer); resolve(rd.result); } };
    rd.onerror=function(){ if(!done){ done=true; clearTimeout(timer); reject(new Error("read")); } };
    try{ rd.readAsDataURL(file); }catch(e){ if(!done){ done=true; clearTimeout(timer); reject(e); } }
  });
}

function parseFirebaseConfig(raw){
  if(!raw) return null;
  try{ var j=JSON.parse(raw); if(j && j.apiKey) return j; }catch(e){}
  // Extract key: "value" pairs from a pasted JS object literal.
  var cfg={};
  var re=/(\w+)\s*:\s*"([^"]*)"/g, m;
  while((m=re.exec(raw))!==null){ cfg[m[1]]=m[2]; }
  if(cfg.apiKey && (cfg.databaseURL || cfg.projectId)) return cfg;
  return null;
}
